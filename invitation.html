<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, collection, addDoc, onSnapshot, query, where } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDbjJtLLDniHbALfUhzQ-UiN2j5txR8PGM",
    authDomain: "wedding-qr-16d01.firebaseapp.com",
    projectId: "wedding-qr-16d01",

    messagingSenderId: "1036657421971",
    appId: "1:1036657421971:web:7ac5618871ec061fba6766"

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  window._db = db;
  window._guestsCol = collection(db, 'guests');

<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Tajawal:wght@300;400;500;700&display=swap');

.wrap { max-width: 480px; margin: 0 auto; padding: 0 18px; }

}
input:focus { outline: none; border-color: var(--gold); }
input::placeholder { color: #6f6a62; }
input[type=number] { text-align: center; }

.btn {
  width: 100%; padding: 16px 24px; border: none; border-radius: 14px; cursor: pointer;
  background: linear-gradient(135deg, var(--gold-deep) 0%, var(--gold) 45%, var(--gold-light) 100%);
  color: #2a1d05; font-family: 'Tajawal', sans-serif; font-size: 16px; font-weight: 700;

.toast {

  box-shadow: 0 10px 36px rgba(var(--accent-rgb),0.45); pointer-events: none; max-width: 90vw; text-align: center;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

.footer { text-align: center; color: var(--text-soft); font-size: 11.5px; margin-top: 26px; opacity: 0.6; }

        <path d="M70 22 L74 31 L83 32 L76 39 L78 48 L70 43 L62 48 L64 39 L57 32 L66 31 Z" fill="url(#ringGold)"/>

<div class="toast" id="toast"></div>

<script>
let myReqId = null;
let requests = [];
let guests = [];
let renderedPasses = false;

function onDbReady(cb) {
  if (window._dbReady) cb();
  else window.addEventListener('dbReady', cb);
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

function escapeHtml(str) {
  return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// The request is identified by the ?id= parameter in the personal link
// sent by email — not by remembering the device. That way the barcode
// opens from any phone, and this page stays reusable for the next guest.
function readIdFromUrl() {
  try { return new URLSearchParams(window.location.search).get('id'); } catch(e) { return null; }
}

// ---- Submit ----
async function submitRequest() {
  const name = document.getElementById('g-name').value.trim();
  const email = document.getElementById('g-email').value.trim();
  const companions = parseInt(document.getElementById('g-companions').value) || 0;

  if (name.length < 3) { showToast('⚠️ اكتب اسمك الكامل'); return; }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { showToast('⚠️ البريد الإلكتروني غير صحيح'); return; }
  if (companions < 0 || companions > 10) { showToast('⚠️ عدد المرافقين غير صحيح'); return; }

  const btn = document.getElementById('submit-btn');
  btn.disabled = true;
  btn.textContent = 'جاري الإرسال...';

  onDbReady(async () => {
    try {
      const { addDoc } = window._firestore;
      const reqId = 'REQ-' + Math.random().toString(36).substr(2, 8).toUpperCase()
                            + Date.now().toString(36).toUpperCase().substr(-4);
      await addDoc(window._requestsCol, {
        reqId, name, email, companions,
        approved: false,
        createdAt: new Date().toISOString()
      });
      myReqId = reqId;
      showToast('✅ تم إرسال طلبك');
      render();
      startLiveData();
    } catch (e) {
      console.error(e);
      showToast('⚠️ تعذّر الإرسال، حاول مرة ثانية');
      btn.disabled = false;
      btn.textContent = 'إرسال ✉️';
    }
  });
}

// ---- Status view ----
// Only shown when the visitor arrived through their personal link
// (?id=REQ-XXXX), which is what the approval email contains. A plain
// visit always shows an empty form, so the same phone can register
// several people one after another.
function render() {
  if (!myReqId) return;
  const req = requests.find(r => r.reqId === myReqId);
  if (!req) return;

  document.getElementById('form-card').style.display = 'none';
  const card = document.getElementById('status-card');
  card.style.display = 'block';
  const body = document.getElementById('status-body');

  if (!req.approved) {
    document.getElementById('status-title').textContent = 'طلبك قيد المراجعة';
    body.innerHTML = `
      <div class="status">
        <div class="icon">⏳</div>
        <div class="msg">شكراً ${escapeHtml(req.name)}<br>تم استلام طلبك بنجاح</div>
        <div class="sub">
          سيصلك الباركود على بريدك الإلكتروني.<br>
          <strong>تفقّد بريد الرسائل غير المرغوبة (Spam)</strong> إن لم تجده.
        </div>
      </div>`;
    renderedPasses = false;
    return;
  }

  // Approved
  const mine = guests.filter(g => g.reqId === myReqId);
  document.getElementById('status-title').textContent = 'باركودك جاهز 🎉';

  // Guests can arrive from Firestore slightly after the approval flag —
  // don't lock the "already rendered" flag until we actually have
  // someone to draw, otherwise an empty snapshot permanently blocks
  // the real one that follows.
  if (mine.length === 0) return;
  if (renderedPasses) return;   // don't redraw the cards on every snapshot
  renderedPasses = true;

  body.innerHTML = `
    <div class="status">
      <div class="icon">✅</div>
      <div class="msg">تفضّل باركودك</div>
      <div class="sub">
        احتفظ بالباركود وأبرزه عند البوابة.<br>
        وصلتك نسخة أيضاً على بريدك الإلكتروني.
      </div>
    </div>
    <div id="passes"></div>`;

  const holder = document.getElementById('passes');
  mine.forEach(g => {
    const box = document.createElement('div');
    box.className = 'pass';
    box.innerHTML = `<div class="pass-name">${escapeHtml(g.name)}</div>`;
    holder.appendChild(box);

    buildInvitationCard(g).then(card => {
      if (!card) return;
      const img = new Image();
      img.src = card.toDataURL('image/png');
      box.appendChild(img);
      const btn = document.createElement('button');
      btn.className = 'btn';
      btn.textContent = '💾 حفظ الدعوة';
      btn.onclick = () => savePass(card, g.name);
      box.appendChild(btn);
    });
  });
}

// Save/share one pass — share sheet on iOS, download elsewhere
function savePass(card, name) {
  const safeName = String(name).trim().replace(/[\s\/\\:*?"<>|]+/g, '_');
  const fileName = 'Invitation-' + safeName + '.png';
  card.toBlob(async (blob) => {
    if (!blob) { showToast('⚠️ تعذّر الحفظ'); return; }
    try {
      const file = new File([blob], fileName, { type: 'image/png' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: name });
        return;
      }
    } catch (e) {
      if (e && e.name === 'AbortError') return;
    }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.download = fileName; a.href = url;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 60000);
    showToast('📥 تم الحفظ');
  }, 'image/png');
}

// ---- Invitation card (same design as the main system) ----
function drawSparkle(ctx, x, y, size, color) {
  ctx.save(); ctx.fillStyle = color; ctx.beginPath();
  ctx.moveTo(x, y - size);
  ctx.quadraticCurveTo(x + size * 0.18, y - size * 0.18, x + size, y);
  ctx.quadraticCurveTo(x + size * 0.18, y + size * 0.18, x, y + size);
  ctx.quadraticCurveTo(x - size * 0.18, y + size * 0.18, x - size, y);
  ctx.quadraticCurveTo(x - size * 0.18, y - size * 0.18, x, y - size);
  ctx.fill(); ctx.restore();
}
function drawFadedLine(ctx, x1, x2, y, color) {
  const g = ctx.createLinearGradient(x1, y, x2, y);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(0.5, color); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.strokeStyle = g; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(x1, y); ctx.lineTo(x2, y); ctx.stroke();
}
function hexToRgba(hex, alpha) {
  const h = hex.replace('#', '');
  return 'rgba(' + parseInt(h.substring(0,2),16) + ',' + parseInt(h.substring(2,4),16) + ',' + parseInt(h.substring(4,6),16) + ',' + alpha + ')';
}

function buildInvitationCard(guest) {
  return new Promise((resolve) => {
    const GOLD = '#C9A84C';
    const GOLD_LIGHT = '#E0BC7A';

    const tmp = document.createElement('div');
    tmp.style.cssText = 'position:fixed;left:-9999px;top:-9999px;background:white;padding:12px;';
    document.body.appendChild(tmp);

    new QRCode(tmp, {
      text: guest.id,
      width: 400, height: 400,
      colorDark: '#0A0A0A', colorLight: '#FAFAF8',
      correctLevel: QRCode.CorrectLevel.H
    });

    const fontsReady = (document.fonts && document.fonts.ready)
      ? Promise.all([
          document.fonts.load('bold 62px Tajawal'),
          document.fonts.load('bold 38px "Playfair Display"'),
          document.fonts.ready
        ]).catch(() => {})
      : Promise.resolve();

    // Wait for the QR canvas to actually appear instead of a fixed delay —
    // slower devices/networks (first font load, weak connection) can take
    // longer than a fixed timeout, which silently failed before.
    function waitForQr(retriesLeft) {
      const qr = tmp.querySelector('canvas');
      if (qr) return Promise.resolve(qr);
      if (retriesLeft <= 0) return Promise.resolve(null);
      return new Promise(r => setTimeout(r, 100)).then(() => waitForQr(retriesLeft - 1));
    }

    fontsReady.then(() => waitForQr(30)).then((qr) => new Promise(r => setTimeout(() => r(qr), 80))).then((qr) => {
      if (!qr) { document.body.removeChild(tmp); resolve(null); return; }

      const card = document.createElement('canvas');
      card.width = 1000; card.height = 1400;
      const ctx = card.getContext('2d');

      ctx.fillStyle = '#FAFAF8';
      ctx.fillRect(0, 0, 1000, 1400);

      const glow = ctx.createRadialGradient(500, 530, 60, 500, 530, 520);
      glow.addColorStop(0, hexToRgba(GOLD, 0.10));
      glow.addColorStop(1, hexToRgba(GOLD, 0));
      ctx.fillStyle = glow; ctx.fillRect(0, 150, 1000, 800);

      ctx.fillStyle = GOLD;
      ctx.fillRect(0, 0, 1000, 22); ctx.fillRect(0, 1378, 1000, 22);
      ctx.fillRect(0, 0, 6, 1400); ctx.fillRect(994, 0, 6, 1400);

      ctx.strokeStyle = hexToRgba(GOLD, 0.35); ctx.lineWidth = 1.5;
      ctx.strokeRect(42, 42, 916, 1316);

      const tg = ctx.createLinearGradient(300, 0, 700, 0);
      tg.addColorStop(0, GOLD); tg.addColorStop(0.5, GOLD_LIGHT); tg.addColorStop(1, GOLD);
      ctx.fillStyle = tg; ctx.font = 'bold 62px Tajawal, Arial'; ctx.textAlign = 'center';
      ctx.fillText('دعوة زفاف', 500, 118);

      ctx.fillStyle = '#999'; ctx.font = '34px Tajawal, Arial';
      ctx.fillText('الخميس 3 سبتمبر 2026', 500, 172);

      drawFadedLine(ctx, 280, 720, 205, GOLD);

      const qx = 180, qy = 232, qw = 640, qh = 640, rr = 28;
      ctx.save(); ctx.beginPath();
      ctx.moveTo(qx + rr, qy);
      ctx.arcTo(qx + qw, qy, qx + qw, qy + qh, rr);
      ctx.arcTo(qx + qw, qy + qh, qx, qy + qh, rr);
      ctx.arcTo(qx, qy + qh, qx, qy, rr);
      ctx.arcTo(qx, qy, qx + qw, qy, rr);
      ctx.closePath();
      ctx.fillStyle = '#FFFFFF';
      ctx.shadowColor = 'rgba(0,0,0,0.10)'; ctx.shadowBlur = 24; ctx.shadowOffsetY = 6;
      ctx.fill(); ctx.restore();
      ctx.strokeStyle = hexToRgba(GOLD, 0.5); ctx.lineWidth = 1.5; ctx.stroke();

      ctx.drawImage(qr, 220, 272, 560, 560);

      ctx.fillStyle = '#0A0A0A'; ctx.font = 'bold 54px Tajawal, Arial';
      ctx.fillText(guest.name, 500, 940);

      ctx.fillStyle = '#B0AAA0'; ctx.font = '28px "Playfair Display", Arial';
      ctx.fillText(guest.id, 500, 992);

      drawFadedLine(ctx, 220, 780, 1028, 'rgba(0,0,0,0.18)');

      ctx.fillStyle = GOLD; ctx.font = 'bold 38px "Playfair Display", Arial';
      ctx.fillText('Golden Halls', 500, 1088);
      ctx.strokeStyle = hexToRgba(GOLD, 0.55); ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(300, 1076); ctx.lineTo(360, 1076); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(640, 1076); ctx.lineTo(700, 1076); ctx.stroke();

      ctx.fillStyle = '#888'; ctx.font = '26px Tajawal, Arial';
      ctx.fillText('هذا الباركود لشخص واحد فقط', 500, 1148);
      ctx.fillStyle = '#666'; ctx.font = '24px Tajawal, Arial';
      ctx.fillText('احتفظ بهذا الباركود للدخول وإبرازه عند البوابة', 500, 1200);

      drawSparkle(ctx, 92, 92, 16, GOLD);
      drawSparkle(ctx, 908, 92, 16, GOLD);
      drawSparkle(ctx, 92, 1308, 16, GOLD);
      drawSparkle(ctx, 908, 1308, 16, GOLD);

      document.body.removeChild(tmp);
      resolve(card);
    });
  });
}

// ---- Live data ----
// Only listen to THIS guest's own request + guest records — not the whole
// collection. Every open guest tab used to stream all 300+ records live,
// which is unnecessary cost and exposes other guests' data client-side.
function startLiveData() {
  if (!myReqId) return; // no ID in URL yet — nothing to listen to
  onDbReady(() => {
    const { onSnapshot, query, where } = window._firestore;

    onSnapshot(query(window._requestsCol, where('reqId', '==', myReqId)), (snap) => {
      requests = snap.docs.map(d => ({ docId: d.id, ...d.data() }));
      render();
    });

    onSnapshot(query(window._guestsCol, where('reqId', '==', myReqId)), (snap) => {
      guests = snap.docs.map(d => ({ docId: d.id, ...d.data() }));
      render();
    });
  });
}

window.addEventListener('load', () => {
  myReqId = readIdFromUrl();
  if (myReqId) { render(); startLiveData(); }
});
</script>

</body>
</html>
