<!-- If one of this page's own script files fails to download (a weak phone
     signal), the page would open half-working with no message — a dashboard
     with no invite link, a login button that does nothing. Offer a reload. -->
<script>window.addEventListener('error', function (e) {
  var t = e.target;
  if (!t || t.tagName !== 'SCRIPT' || !t.src || t.src.indexOf(location.origin + '/') !== 0) return;
  function show() {
    if (document.getElementById('load-fail')) return;
    var d = document.createElement('div');
    d.id = 'load-fail'; d.setAttribute('role', 'alert');
    d.textContent = '⚠️ ما اكتمل تحميل الصفحة بسبب ضعف الإنترنت — اضغط هنا لإعادة التحميل';
    d.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:100000;background:#b3261e;color:#fff;padding:14px 16px;text-align:center;font:600 15px/1.6 sans-serif;cursor:pointer;';
    d.onclick = function () { location.reload(); };
    document.body.appendChild(d);
  }
  if (document.body) show(); else document.addEventListener('DOMContentLoaded', show);
}, true);</script>

  #splash::before { content:''; position:absolute; width:460px; height:460px; border-radius:50%; background:radial-gradient(circle, rgba(var(--accent-rgb),0.12), transparent 70%); animation:splashPulse 3.5s ease-in-out infinite; }

<body>
  <div id="splash">
    <div class="splash-inner">
      <div class="splash-rings"><img src="icons/logo.svg" alt="" style="display:block; margin:0 auto; height:104px; width:104px;"></div>
      <div class="splash-title">دعوات</div>
      <div class="splash-subtitle">Digital Invitations</div>
      <div class="splash-line"></div>
    </div>
  </div>
  <script>
  // The opening splash matches the kind of event: its own picture and title.
  // The sample invitation (?demo=1) knows it from ?type= (none picked yet: the
  // neutral logo). A real invitation only learns it once the event loads, so it
  // starts from the kind this device saw last time for this link (instant on a
  // repeat visit), otherwise the neutral logo, and showInviteKind() fades the
  // right one in when the event arrives. Runs before first paint and depends
  // on nothing else, so it's inline, guarded, and tiny.
  (function () {
    try {
      const p = new URLSearchParams(location.search);
      const KINDS = {
        wedding:    ['دعوة زفاف', 'Wedding Invitation', 'kind-wedding.svg'],
        graduation: ['دعوة حفل تخرج', 'Graduation Invitation', 'kind-graduation.svg'],
        event:      ['دعوة فعالية', 'Event Invitation', 'kind-event.svg'],
      };
      const LOGO = ['دعوات', 'Digital Invitations', 'logo.svg'];
      // hasOwnProperty, so ?type=constructor and the like can't pick up inherited keys.
      const kindOf = (t) => Object.prototype.hasOwnProperty.call(KINDS, t) ? KINDS[t] : null;
      const inner = document.querySelector('#splash .splash-inner');
      let shown = null;
      const paint = (k) => {
        shown = k;
        inner.querySelector('.splash-title').textContent = k[0];
        inner.querySelector('.splash-subtitle').textContent = k[1];
        const img = inner.querySelector('.splash-rings img');
        img.src = 'icons/' + k[2];
        img.style.height = k[2] === 'logo.svg' ? '104px' : '96px';
        img.style.width = k[2] === 'logo.svg' ? '104px' : 'auto';
      };
      if (p.get('demo') === '1') { paint(kindOf(p.get('type')) || LOGO); window._splashDataAt = Date.now(); return; }
      const key = 'inv_kind_' + (p.get('event') || 's:' + (p.get('s') || '').toLowerCase());
      let saved = null;
      try { saved = localStorage.getItem(key); } catch (e) {}
      paint(kindOf(saved) || LOGO);
      window.showInviteKind = function (t) {
        window._splashDataAt = Date.now();
        try { localStorage.setItem(key, t); } catch (e) {}
        const k = kindOf(t);
        if (!k || k === shown) return;
        // Seen for a moment at least: the splash hider below waits for this.
        window._splashKindAt = Date.now();
        inner.style.transition = 'opacity 0.25s ease';
        inner.style.opacity = '0';
        setTimeout(() => { paint(k); inner.style.opacity = '1'; }, 250);
      };
    } catch (e) {}
  })();
  </script>
  <script>
  // Isolated on purpose, and NOT gated on window.load — if this lived
  // inside the big application script below and something earlier in that
  // script threw (a slow/failed CDN script, a bug, a bad connection), the
  // splash would never get hidden and would block the real page forever.
  // This one line is all this tiny script does, so nothing else on the
  // page can prevent it from running.
  // Hides once the event's data has arrived, at least 1.6 seconds after the
  // start (the entrance animation), and 1.2 seconds after its own picture faded
  // in; never later than 3.5 seconds in all (data that never arrives included).
  const splashStart = Date.now();
  setTimeout(function hideSplash() {
    const now = Date.now();
    const elapsed = now - splashStart;
    if (elapsed < 3500) {
      const wait = window._splashDataAt
        ? Math.max(1600 - elapsed, (window._splashKindAt || 0) + 1200 - now)
        : 200;
      if (wait > 0) { setTimeout(hideSplash, Math.min(wait, 3500 - elapsed)); return; }
    }
    const splash = document.getElementById('splash');
    if (splash) splash.classList.add('hide');
  }, 100);

<script>
const params = new URLSearchParams(window.location.search);
// ?event=<id> is the original link; ?s=<name> comes from a readable link like
// da3wt.com/hala-turki (404.html forwards it here) and is looked up in

const slugParam = (params.get('s') || '').toLowerCase();

// While the event is loading the card holds a tall placeholder so the page
// doesn't jump when the real content arrives (layout shift); once the loading
// line is replaced, the reserved height is released.
new MutationObserver(function (_m, obs) {
  if (!document.getElementById('loading')) { card.classList.remove('card-wait'); obs.disconnect(); }
}).observe(card, { childList: true });
// ?demo=1 — a sample invitation for prospective customers, opened from the
// landing page. It is the real invitation page with a made-up event: nothing
// is read from or written to the database, so it can't be spammed and never
// touches a real event.

// each kind is a different made-up event (name, place, colours, splash), so
// someone planning a graduation sees a graduation invitation, not a wedding
// one. ?type= can also be linked to directly (e.g. sent to a school).
const isDemo = params.get('demo') === '1';
const DEMO_KINDS = {
  wedding:    { label: 'زفاف',   name: 'حفل زفاف أحمد وسارة',      venue: 'قاعة الأفراح — الرياض',        theme: 'gold' },
  graduation: { label: 'تخرج',   name: 'حفل تخرج دفعة 2026',       venue: 'مدرسة الأمل الأهلية — الدمام', theme: 'sapphire' },
  event:      { label: 'فعالية', name: 'ملتقى ريادة الأعمال 2026', venue: 'مركز المؤتمرات — الرياض',      theme: 'emerald' },
};
// hasOwnProperty, so ?type=constructor and the like can't pick up inherited keys.
const demoKind = Object.prototype.hasOwnProperty.call(DEMO_KINDS, params.get('type')) ? params.get('type') : null;
const DEMO_EVENT = demoKind ? {
  name: DEMO_KINDS[demoKind].name,

// Maps link + live countdown to the event date, shown above the RSVP form
// and again once the guest is approved. Time defaults to 8pm Riyadh time —

function eventInfoHtml(eventData) {

// Re-renders (the RSVP status listener can re-fire) replace #countdown's
// markup wholesale, so the previous interval must be cleared explicitly —
// otherwise it keeps ticking against a detached element forever.
let countdownTimer = null;

function startCountdown(eventData) {
  if (countdownTimer) { clearInterval(countdownTimer); countdownTimer = null; }
  const el = document.getElementById('countdown');
  if (!el || !eventData.date) return;
  const target = new Date(eventData.date + 'T20:00:00+03:00').getTime();
  if (isNaN(target)) return;
  function tick() {
    const diff = target - Date.now();
    if (diff <= 0) {
      el.textContent = '🎉 وصل الموعد 🎉';
      clearInterval(countdownTimer);
      countdownTimer = null;
      return;
    }
    const d = Math.floor(diff / 86400000);
    const h = Math.floor((diff % 86400000) / 3600000);
    const m = Math.floor((diff % 3600000) / 60000);
    const parts = [];
    if (d > 0) parts.push(d + ' ' + arPlural(d, 'يوم', 'يومين', 'أيام'));
    parts.push(h + ' ' + arPlural(h, 'ساعة', 'ساعتين', 'ساعات'));
    parts.push(m + ' ' + arPlural(m, 'دقيقة', 'دقيقتين', 'دقائق'));
    el.textContent = 'باقي ' + parts.join(' و ');
  }

}

// 128 random bits from the browser's secure generator. It's the guest's only
// key to their own request (and to the barcode card that appears on it), so
// it has to be unguessable — Math.random() is not.
function newReqId() {
  const bytes = new Uint8Array(16);
  crypto.getRandomValues(bytes);
  return 'REQ-' + Array.from(bytes, b => b.toString(16).padStart(2, '0')).join('').toUpperCase();
}

async function submitRequest() {

function hexToRgba(hex, alpha) {
  const h = hex.replace('#', '');
  const r = parseInt(h.substring(0, 2), 16);
  const g = parseInt(h.substring(2, 4), 16);
  const b = parseInt(h.substring(4, 6), 16);
  return 'rgba(' + r + ',' + g + ',' + b + ',' + alpha + ')';
}

function drawSparkle(ctx, x, y, size, color) {
  ctx.save();
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(x, y - size);
  ctx.lineTo(x + size * 0.28, y - size * 0.28);
  ctx.lineTo(x + size, y);
  ctx.lineTo(x + size * 0.28, y + size * 0.28);
  ctx.lineTo(x, y + size);
  ctx.lineTo(x - size * 0.28, y + size * 0.28);
  ctx.lineTo(x - size, y);
  ctx.lineTo(x - size * 0.28, y - size * 0.28);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function drawFadedLine(ctx, x1, x2, y, color) {
  const g = ctx.createLinearGradient(x1, y, x2, y);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(0.5, color);
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.strokeStyle = g;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(x1, y); ctx.lineTo(x2, y);
  ctx.stroke();
}

// Draws the same polished printable card the organizer's dashboard uses —
// canvas-based so it renders identically everywhere, and produces a real
// <img> (via toDataURL) that iOS/Android "save image" actually works on,
// unlike a bare <canvas> which most mobile browsers won't let you save.
const THEME_COLORS = {
  gold:     { accent: '#C9A84C', accentLight: '#E0BC7A' },
  rose:     { accent: '#C9879A', accentLight: '#E8B4B8' },
  emerald:  { accent: '#2E7D5A', accentLight: '#D4AF7F' },
  sapphire: { accent: '#5A6FA0', accentLight: '#8A9DC9' },
  ivory:    { accent: '#9C7A45', accentLight: '#B08D57' }
};

// qrcodejs is only needed once a request is approved, so it is fetched then
// rather than blocking every visit. Rejects if the CDN fails, so the caller
// can show a retry instead of a blank card.
let qrLibPromise = null;
function loadQrLib() {
  if (window.QRCode) return Promise.resolve();
  if (!qrLibPromise) {
    qrLibPromise = new Promise((resolve, reject) => {
      const fail = () => { qrLibPromise = null; reject(new Error('qrcode')); };
      const s = document.createElement('script');
      s.src = 'https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';
      s.async = true;
      s.onload = () => {
        let tries = 0;
        (function check() {
          if (window.QRCode) return resolve();
          if (++tries > 40) return fail();
          setTimeout(check, 50);
        })();
      };
      s.onerror = () => { s.remove(); fail(); };
      document.head.appendChild(s);
    });
  }
  return qrLibPromise;
}

function buildInviteCard(eventData, guest) {
  return new Promise((resolve) => {
    if (!window.QRCode) { resolve(null); return; }
    const themeColors = THEME_COLORS[eventData.theme || 'gold'] || THEME_COLORS.gold;
    const GOLD = themeColors.accent;
    const GOLD_LIGHT = themeColors.accentLight;

    const tmp = document.createElement('div');
    tmp.style.cssText = 'position:fixed;left:-9999px;top:-9999px;background:white;padding:12px;';
    document.body.appendChild(tmp);

    new QRCode(tmp, {
      text: guest.id, width: 400, height: 400,
      colorDark: '#0A0A0A', colorLight: '#FAFAF8',
      correctLevel: QRCode.CorrectLevel.H
    });

    // qrcodejs creates the <canvas> element up front but can (rarely, e.g.
    // when several cards render back to back) leave it painted a moment
    // later — checking the element exists isn't enough, it can still be a
    // blank canvas filled with just the background color. Sample a grid of
    // pixels for any actual dark (QR) ink before accepting it.
    function qrCanvasHasContent(canvas) {
      try {
        const c2 = canvas.getContext('2d');
        const w = canvas.width, h = canvas.height;
        const data = c2.getImageData(0, 0, w, h).data;
        for (let y = 0; y < h; y += 8) {
          for (let x = 0; x < w; x += 8) {
            if (data[(y * w + x) * 4] < 128) return true;
          }
        }
        return false;
      } catch (e) {
        return true; // can't inspect (e.g. tainted canvas) — trust it exists
      }
    }

    function waitForQr(retriesLeft) {
      const qr = tmp.querySelector('canvas');
      if (qr && qrCanvasHasContent(qr)) return Promise.resolve(qr);
      if (retriesLeft <= 0) return Promise.resolve(qr || null);
      return new Promise(r => setTimeout(r, 100)).then(() => waitForQr(retriesLeft - 1));
    }

    waitForQr(30).then((qr) => new Promise(r => setTimeout(() => r(qr), 80))).then((qr) => {
      if (!qr) { document.body.removeChild(tmp); resolve(null); return; }

      // Some browsers (notably Firefox, as an anti-fingerprinting measure)
      // silently blank out pixels drawn via ctx.drawImage(sourceCanvas, ...)
      // without throwing. Converting the QR canvas to a data URL and loading
      // it into a plain <img> first avoids that canvas-to-canvas copy path.
      const qrDataUrl = qr.toDataURL('image/png');
      const qrImg = new Image();
      qrImg.onload = () => buildCardWithQr(qrImg);
      qrImg.onerror = () => buildCardWithQr(qr);
      qrImg.src = qrDataUrl;
    });

    function buildCardWithQr(qr) {
      const c = document.createElement('canvas');
      c.width = 1000; c.height = 1400;
      const ctx = c.getContext('2d');

      ctx.fillStyle = '#FAFAF8';
      ctx.fillRect(0, 0, 1000, 1400);

      const glow = ctx.createRadialGradient(500, 530, 60, 500, 530, 520);
      glow.addColorStop(0, hexToRgba(GOLD, 0.10));
      glow.addColorStop(1, hexToRgba(GOLD, 0));
      ctx.fillStyle = glow;
      ctx.fillRect(0, 150, 1000, 800);

      ctx.fillStyle = GOLD;
      ctx.fillRect(0, 0, 1000, 22);
      ctx.fillRect(0, 1378, 1000, 22);
      ctx.fillRect(0, 0, 6, 1400);
      ctx.fillRect(994, 0, 6, 1400);

      ctx.strokeStyle = hexToRgba(GOLD, 0.35);
      ctx.lineWidth = 1.5;
      ctx.strokeRect(42, 42, 916, 1316);

      const titleGrad = ctx.createLinearGradient(300, 0, 700, 0);
      titleGrad.addColorStop(0, GOLD);
      titleGrad.addColorStop(0.5, GOLD_LIGHT);
      titleGrad.addColorStop(1, GOLD);
      ctx.fillStyle = titleGrad;
      ctx.font = 'bold 58px "IBM Plex Sans Arabic", Arial';
      ctx.textAlign = 'center';
      ctx.fillText(eventData.name, 500, 118);

      ctx.fillStyle = '#999';
      ctx.font = '34px "IBM Plex Sans Arabic", Arial';
      ctx.fillText(formatEventDate(eventData.date), 500, 172);

      drawFadedLine(ctx, 280, 720, 205, GOLD);

      const qx = 180, qy = 232, qw = 640, qh = 640, rr = 28;
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(qx + rr, qy);
      ctx.arcTo(qx + qw, qy, qx + qw, qy + qh, rr);
      ctx.arcTo(qx + qw, qy + qh, qx, qy + qh, rr);
      ctx.arcTo(qx, qy + qh, qx, qy, rr);
      ctx.arcTo(qx, qy, qx + qw, qy, rr);
      ctx.closePath();
      ctx.fillStyle = '#FFFFFF';
      ctx.shadowColor = 'rgba(0,0,0,0.10)';
      ctx.shadowBlur = 24;
      ctx.shadowOffsetY = 6;
      ctx.fill();
      ctx.restore();
      ctx.strokeStyle = hexToRgba(GOLD, 0.5);
      ctx.lineWidth = 1.5;
      ctx.stroke();

      ctx.drawImage(qr, 220, 272, 560, 560);

      ctx.fillStyle = '#0A0A0A';
      ctx.font = 'bold 54px "IBM Plex Sans Arabic", Arial';
      ctx.fillText(guest.name, 500, 940);

      ctx.fillStyle = '#B0AAA0';
      ctx.font = '28px "Playfair Display", Arial';
      ctx.fillText(guest.id, 500, 992);

      drawFadedLine(ctx, 220, 780, 1028, 'rgba(0,0,0,0.18)');

      if (eventData.venue) {
        ctx.fillStyle = GOLD;
        ctx.font = 'bold 38px "Playfair Display", Arial';
        ctx.fillText(eventData.venue, 500, 1088);
        ctx.strokeStyle = hexToRgba(GOLD, 0.55);
        ctx.lineWidth = 1.2;
        ctx.beginPath(); ctx.moveTo(300, 1076); ctx.lineTo(360, 1076); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(640, 1076); ctx.lineTo(700, 1076); ctx.stroke();
      }

      ctx.fillStyle = '#888';
      ctx.font = '26px "IBM Plex Sans Arabic", Arial';
      ctx.fillText('هذا الباركود لشخص واحد فقط', 500, 1148);
      ctx.fillStyle = '#666';
      ctx.font = '24px "IBM Plex Sans Arabic", Arial';
      ctx.fillText('احتفظ بهذا الباركود للدخول وإبرازه عند البوابة', 500, 1200);

      drawSparkle(ctx, 92, 92, 16, GOLD);
      drawSparkle(ctx, 908, 92, 16, GOLD);
      drawSparkle(ctx, 92, 1308, 16, GOLD);
      drawSparkle(ctx, 908, 1308, 16, GOLD);

      document.body.removeChild(tmp);
      resolve(c);
    }
  });
}

let cardCanvas = null;
let cardGuestName = '';

async function downloadInviteCard() {
  if (!cardCanvas) return;
  const safeName = String(cardGuestName).trim().replace(/[\s\/\\:*?"<>|]+/g, '_');
  const fileName = 'Invitation-' + safeName + '.png';

  cardCanvas.toBlob(async (blob) => {
    if (!blob) return;
    try {
      const file = new File([blob], fileName, { type: 'image/png' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: cardGuestName });
        return;
      }
    } catch (e) {
      if (e && e.name === 'AbortError') return;
    }
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.download = fileName;
    link.href = url;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  }, 'image/png');
}

async function renderApproved(eventData, guest) {
  // The demo can't simulate the door camera itself — only the card a real
  // guest would end up with — so a visitor could otherwise assume that's
  // the whole product and miss that scanning happens for real at the door.
  const demoScanNote = isDemo
    ? '<div style="margin-top:12px; font-size:12px; color:#8a857a; line-height:1.7;">هذه معاينة لتجربة ضيفك. مسح الكود عند الباب يتم لحظياً عبر كاميرا جوال المشرف بدون الحاجة لتطبيقات.</div>'
    : '';
  card.innerHTML = `
    <div class="status-icon">🎉</div>
    <div class="status-msg">تم تأكيد حضورك!</div>
    ${eventInfoHtml(eventData)}
    <div id="card-wrap" style="margin-top:16px;"></div>
    <button class="btn" id="save-btn" style="margin-top:14px; display:none;" onclick="downloadInviteCard()">⬇️ حفظ الدعوة</button>
    ${demoScanNote}
  `;
  startCountdown(eventData);
  const wrap = document.getElementById('card-wrap');
  async function drawCard() {
    wrap.innerHTML = '<div id="qr-loading" style="text-align:center; color:#8a857a; font-size:13px;">جاري تجهيز بطاقتك...</div>';
    let built = null;
    try { await loadQrLib(); built = await buildInviteCard(eventData, guest); } catch (e) { built = null; }
    if (!built) {
      wrap.innerHTML = '<div class="status-msg" id="qr-retry" style="cursor:pointer">⚠️ تعذّر تجهيز البطاقة بسبب ضعف الإنترنت — اضغط هنا للمحاولة مرة ثانية</div>';
      document.getElementById('qr-retry').onclick = drawCard;
      return;
    }
    cardCanvas = built;
    cardGuestName = guest.name;
    const img = document.createElement('img');
    img.src = built.toDataURL('image/png');
    img.style.cssText = 'width:100%; border-radius:14px; box-shadow:0 8px 30px rgba(0,0,0,0.4);';
    wrap.innerHTML = '';
    wrap.appendChild(img);
    document.getElementById('save-btn').style.display = 'block';
  }
  await drawCard();
}

let currentEvent = null;

function renderPreparing() {
  card.innerHTML = `
    <div class="status-icon">🎉</div>
    <div class="status-msg">تمت الموافقة على حضورك! جاري تجهيز بطاقتك — بتظهر هنا خلال لحظات</div>
  `;
}

let renderedGuestId = null;
let statusUnsub = null;

// The request document is named after its own secret id, and this page opens
// that one document directly. It can no longer ask "give me all requests
// where reqId == mine" — that's a list query, and listing requests is now
// limited to the organizer and the admin (it used to be open to anyone with
// the invite link, which exposed every guest's name and, once approved,
// their barcode id). One guest can't open another's request because
// the id is 128 random bits they never see.
function watchStatus() {
  const { doc, onSnapshot } = window._fsFns;
  if (statusUnsub) { statusUnsub(); statusUnsub = null; }
  statusUnsub = onSnapshot(doc(window._db, 'events', eventId, 'requests', myReqId), (snap) => {
    if (!snap.exists()) {
      // Nothing under this id: a request made before requests were named
      // after their id, or one the organizer deleted. Either way there's
      // nothing to wait for — let the guest register again.
      renderedGuestId = null;
      retryRequest();
      return;
    }
    const req = snap.data();
    if (req.status === 'pending') { renderedGuestId = null; renderPending(); }
    else if (req.status === 'rejected') { renderedGuestId = null; renderRejected(); }
    else if (req.status === 'approved') {
      // The barcode id is copied onto the request when the organizer
      // approves it — this page can't read the guests collection (it's no
      // longer world-readable). An approval that predates that gets its id
      // filled in the next time the organizer opens their dashboard, and
      // this same listener picks it up.
      if (!req.guestId) { renderedGuestId = null; renderPreparing(); return; }
      if (renderedGuestId === req.guestId) return;
      renderedGuestId = req.guestId;
      renderApproved(currentEvent, { name: req.name, id: req.guestId });
    }
  });
}

async function init() {
  const { doc, getDoc } = window._fsFns;
  if (!eventId && slugParam) {
    try {
      const s = await getDoc(doc(window._db, 'slugs', slugParam));
      if (!s.exists()) { card.innerHTML = '<div class="status-msg">⚠️ هذا الرابط غير موجود</div>'; return; }
      eventId = s.data().eventId;
      try { myReqId = localStorage.getItem('inv_reqid_' + eventId) || null; } catch (e) {}
      // Keep the readable link in the address bar (a reload goes through 404.html again).
      try { history.replaceState(null, '', '/' + slugParam); } catch (e) {}
    } catch (e) {
      console.error(e);
      card.innerHTML = '<div class="status-msg" id="retry-msg" style="cursor:pointer">⚠️ تعذّر الاتصال — اضغط هنا للمحاولة مرة ثانية</div>';
      document.getElementById('retry-msg').onclick = init;
      return;
    }
  }
  if (!eventId) { card.innerHTML = '<div class="status-msg">⚠️ رابط غير صحيح</div>'; return; }
  let snap;
  try {
    snap = await getDoc(doc(window._db, 'events', eventId));
  } catch (e) {
    // Same "trapped forever" failure the splash fix closed, one layer
    // deeper: a dropped connection here used to leave a guest stuck on
    // "جاري التحميل..." forever with no way to actually RSVP.
    console.error(e);
    card.innerHTML = '<div class="status-msg" id="retry-msg" style="cursor:pointer">⚠️ تعذّر الاتصال — اضغط هنا للمحاولة مرة ثانية</div>';
    document.getElementById('retry-msg').onclick = init;
    return;
  }
  if (!snap.exists()) { card.innerHTML = '<div class="status-msg">⚠️ هذه المناسبة غير موجودة</div>'; return; }
  currentEvent = snap.data();
  document.body.setAttribute('data-theme', currentEvent.theme || 'gold');
  if (window.showInviteKind) window.showInviteKind(eventTypeOf(currentEvent));

  if (myReqId) watchStatus();
  else renderForm(currentEvent);
}

if (isDemo) {
  startDemo();          // needs no database at all
} else if (window._db) {
  init();
} else {
  // Same "trapped forever" failure other pages' init guards close: a slow
  // or dropped connection while firebase-init-lite.js's own CDN imports load
  // means appDbReady never fires, leaving this stuck on "جاري التحميل..."
  // forever with no way out.
  const appDbTimeout = setTimeout(() => {
    const el = document.getElementById('loading');
    el.textContent = '⚠️ تعذّر الاتصال — اضغط هنا للمحاولة مرة ثانية';
    el.style.cursor = 'pointer';
    el.onclick = () => location.reload();
  }, 8000);
  window.addEventListener('appDbReady', () => { clearTimeout(appDbTimeout); init(); });
}
</script>
</body>
</html>
