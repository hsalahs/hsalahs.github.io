<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دعوة | دعوات</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import {
    getFirestore, doc, getDoc, collection, addDoc, onSnapshot, query, where
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDbjJtLLDniHbALfUhzQ-UiN2j5txR8PGM",
    authDomain: "wedding-qr-16d01.firebaseapp.com",
    projectId: "wedding-qr-16d01",
    storageBucket: "wedding-qr-16d01.firebasestorage.app",
    messagingSenderId: "1036657421971",
    appId: "1:1036657421971:web:7ac5618871ec061fba6766"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  window._db = db;
  window._fsFns = { doc, getDoc, collection, addDoc, onSnapshot, query, where };
  window.dispatchEvent(new Event('appDbReady'));
</script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Tajawal:wght@400;500;700&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }

  /* ===== THEME SYSTEM — matches app.html/event.html ===== */
  :root, [data-theme="gold"] {
    --gold:#E0BC7A; --gold-deep:#C99B4A;
    --bg-base:#0A0A0A; --bg-1:#0C0C0C; --bg-2:#060606;
    --glow-1:rgba(var(--accent-rgb),0.12); --glow-2:rgba(201,155,74,0.08);
    --accent-rgb:224,188,122; --text-main:#FAF8F4; --text-soft:#B8B4AC;
    --glass-bg:rgba(255,255,255,0.035);
  }
  [data-theme="rose"] {
    --gold:#E8B4B8; --gold-deep:#C9879A;
    --bg-base:#14090C; --bg-1:#1A0C10; --bg-2:#0E0608;
    --glow-1:rgba(232,180,184,0.14); --glow-2:rgba(201,135,154,0.10);
    --accent-rgb:232,180,184; --text-main:#FAF4F4; --text-soft:#C9B4B6;
    --glass-bg:rgba(255,255,255,0.035);
  }
  [data-theme="emerald"] {
    --gold:#D4AF7F; --gold-deep:#B08D57;
    --bg-base:#07120E; --bg-1:#0A1812; --bg-2:#040C08;
    --glow-1:rgba(var(--accent-rgb),0.12); --glow-2:rgba(46,125,90,0.14);
    --accent-rgb:212,175,127; --text-main:#F4FAF6; --text-soft:#AEC2B7;
    --glass-bg:rgba(255,255,255,0.035);
  }
  [data-theme="sapphire"] {
    --gold:#B8C6E0; --gold-deep:#8A9DC9;
    --bg-base:#080C16; --bg-1:#0C1220; --bg-2:#04060E;
    --glow-1:rgba(184,198,224,0.12); --glow-2:rgba(138,157,201,0.12);
    --accent-rgb:184,198,224; --text-main:#F4F6FA; --text-soft:#AEB7C9;
    --glass-bg:rgba(255,255,255,0.035);
  }
  [data-theme="ivory"] {
    --gold:#B08D57; --gold-deep:#9C7A45;
    --bg-base:#F6F1E7; --bg-1:#FAF6EE; --bg-2:#EFE7D6;
    --glow-1:rgba(176,141,87,0.10); --glow-2:rgba(176,141,87,0.07);
    --accent-rgb:176,141,87; --text-main:#2A2419; --text-soft:#7A7060;
    --glass-bg:rgba(255,255,255,0.55);
  }

  body {
    font-family:'Tajawal',sans-serif; background:var(--bg-base); color:var(--text-main); min-height:100vh;
    display:flex; align-items:center; justify-content:center; padding:20px; position:relative; overflow-x:hidden;
    transition:background 0.4s ease, color 0.4s ease;
  }
  body::before {
    content:''; position:fixed; inset:0; z-index:0; pointer-events:none;
    background:
      radial-gradient(ellipse 80% 50% at 50% -10%, var(--glow-1), transparent 60%),
      radial-gradient(ellipse 60% 40% at 100% 100%, var(--glow-2), transparent 55%),
      linear-gradient(160deg, var(--bg-1) 0%, var(--bg-base) 50%, var(--bg-2) 100%);
  }
  .card {
    position:relative; z-index:1; width:100%; max-width:380px;
    background:var(--glass-bg); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
    border:1px solid rgba(var(--accent-rgb),0.3); border-radius:22px; padding:42px 30px; text-align:center;
    box-shadow:0 8px 40px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.06);
  }
  .ornament { font-size:20px; color:var(--gold); letter-spacing:8px; margin-bottom:14px; animation:float 3s ease-in-out infinite; }
  @keyframes float { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-6px); } }
  h1 { font-family:'Playfair Display',serif; color:var(--gold); font-size:24px; font-weight:700; margin-bottom:6px; letter-spacing:0.3px; }
  .sub { color:var(--text-soft); font-size:12.5px; margin-bottom:24px; }
  .gold-line { width:56px; height:1px; background:linear-gradient(90deg,transparent,var(--gold),transparent); margin:22px auto; }
  input { width:100%; padding:13px; margin-bottom:14px; border-radius:10px; background:rgba(255,255,255,0.04); border:1px solid rgba(var(--accent-rgb),0.25); color:var(--text-main); font-size:15px; font-family:inherit; text-align:center; }
  input:focus { outline:none; border-color:var(--gold); }
  .btn { width:100%; padding:14px; border:none; border-radius:10px; background:linear-gradient(135deg,var(--gold-deep),var(--gold)); color:#1a1400; font-weight:700; font-size:15px; cursor:pointer; }
  .status-icon { font-size:44px; margin-bottom:10px; }
  .status-msg { font-size:15px; line-height:1.9; }
  #qr-box { margin-top:18px; padding:16px; background:#fff; border-radius:12px; display:inline-block; }
  .guest-name { color:var(--gold); font-weight:700; margin-top:14px; font-size:15px; }
</style>
</head>
<body>
  <div class="card" id="card">
    <div id="loading">جاري التحميل...</div>
  </div>

<script>
const params = new URLSearchParams(window.location.search);
const eventId = params.get('event');
const card = document.getElementById('card');
let myReqId = localStorage.getItem('inv_reqid_' + eventId) || null;

function escapeHtml(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function renderForm(eventData) {
  card.innerHTML = `
    <div class="ornament">✦</div>
    <h1>${escapeHtml(eventData.name)}</h1>
    <div class="sub">${[eventData.date, eventData.venue].filter(Boolean).map(escapeHtml).join(' · ')}</div>
    <div class="gold-line"></div>
    <input type="text" id="g-name" placeholder="الاسم الكامل" onkeydown="if(event.key==='Enter') submitRequest()">
    <button class="btn" onclick="submitRequest()">تأكيد الحضور</button>
  `;
}

async function submitRequest() {
  const name = document.getElementById('g-name').value.trim();
  if (!name) return;
  const { collection, addDoc } = window._fsFns;
  const reqId = 'REQ-' + Math.random().toString(36).substr(2, 8).toUpperCase() + Date.now().toString(36).toUpperCase().substr(-4);
  try {
    await addDoc(collection(window._db, 'events', eventId, 'requests'), {
      name, reqId, status: 'pending', createdAt: new Date().toISOString()
    });
  } catch (e) {
    alert('صار خطأ، حاول مرة ثانية: ' + e.message);
    console.error(e);
    return;
  }
  localStorage.setItem('inv_reqid_' + eventId, reqId);
  myReqId = reqId;
  watchStatus();
}

function renderPending() {
  card.innerHTML = `
    <div class="status-icon">⏳</div>
    <div class="status-msg">تم إرسال طلبك، بانتظار موافقة المنظّم</div>
  `;
}

function renderRejected() {
  card.innerHTML = `
    <div class="status-icon">😕</div>
    <div class="status-msg">للأسف ما قدرنا نأكد حضورك حاليًا</div>
    <button class="btn" style="margin-top:18px;" onclick="retryRequest()">حاول مرة ثانية</button>
  `;
}

function retryRequest() {
  try { localStorage.removeItem('inv_reqid_' + eventId); } catch (e) {}
  myReqId = null;
  renderForm(currentEvent);
}

function hexToRgba(hex, alpha) {
  const h = hex.replace('#', '');
  const r = parseInt(h.substring(0, 2), 16);
  const g = parseInt(h.substring(2, 4), 16);
  const b = parseInt(h.substring(4, 6), 16);
  return 'rgba(' + r + ',' + g + ',' + b + ',' + alpha + ')';
}

function drawSparkle(ctx, x, y, size, color) {
  ctx.save();
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(x, y - size);
  ctx.lineTo(x + size * 0.28, y - size * 0.28);
  ctx.lineTo(x + size, y);
  ctx.lineTo(x + size * 0.28, y + size * 0.28);
  ctx.lineTo(x, y + size);
  ctx.lineTo(x - size * 0.28, y + size * 0.28);
  ctx.lineTo(x - size, y);
  ctx.lineTo(x - size * 0.28, y - size * 0.28);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function drawFadedLine(ctx, x1, x2, y, color) {
  const g = ctx.createLinearGradient(x1, y, x2, y);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(0.5, color);
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.strokeStyle = g;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(x1, y); ctx.lineTo(x2, y);
  ctx.stroke();
}

// Draws the same polished printable card the organizer's dashboard uses —
// canvas-based so it renders identically everywhere, and produces a real
// <img> (via toDataURL) that iOS/Android "save image" actually works on,
// unlike a bare <canvas> which most mobile browsers won't let you save.
const THEME_COLORS = {
  gold:     { accent: '#C9A84C', accentLight: '#E0BC7A' },
  rose:     { accent: '#C9879A', accentLight: '#E8B4B8' },
  emerald:  { accent: '#2E7D5A', accentLight: '#D4AF7F' },
  sapphire: { accent: '#5A6FA0', accentLight: '#8A9DC9' },
  ivory:    { accent: '#9C7A45', accentLight: '#B08D57' }
};

function buildInviteCard(eventData, guest) {
  return new Promise((resolve) => {
    const themeColors = THEME_COLORS[eventData.theme || 'gold'] || THEME_COLORS.gold;
    const GOLD = themeColors.accent;
    const GOLD_LIGHT = themeColors.accentLight;

    const tmp = document.createElement('div');
    tmp.style.cssText = 'position:fixed;left:-9999px;top:-9999px;background:white;padding:12px;';
    document.body.appendChild(tmp);

    new QRCode(tmp, {
      text: guest.id, width: 400, height: 400,
      colorDark: '#0A0A0A', colorLight: '#FAFAF8',
      correctLevel: QRCode.CorrectLevel.H
    });

    function waitForQr(retriesLeft) {
      const qr = tmp.querySelector('canvas');
      if (qr) return Promise.resolve(qr);
      if (retriesLeft <= 0) return Promise.resolve(null);
      return new Promise(r => setTimeout(r, 100)).then(() => waitForQr(retriesLeft - 1));
    }

    waitForQr(30).then((qr) => new Promise(r => setTimeout(() => r(qr), 80))).then((qr) => {
      if (!qr) { document.body.removeChild(tmp); resolve(null); return; }

      const c = document.createElement('canvas');
      c.width = 1000; c.height = 1400;
      const ctx = c.getContext('2d');

      ctx.fillStyle = '#FAFAF8';
      ctx.fillRect(0, 0, 1000, 1400);

      const glow = ctx.createRadialGradient(500, 530, 60, 500, 530, 520);
      glow.addColorStop(0, hexToRgba(GOLD, 0.10));
      glow.addColorStop(1, hexToRgba(GOLD, 0));
      ctx.fillStyle = glow;
      ctx.fillRect(0, 150, 1000, 800);

      ctx.fillStyle = GOLD;
      ctx.fillRect(0, 0, 1000, 22);
      ctx.fillRect(0, 1378, 1000, 22);
      ctx.fillRect(0, 0, 6, 1400);
      ctx.fillRect(994, 0, 6, 1400);

      ctx.strokeStyle = hexToRgba(GOLD, 0.35);
      ctx.lineWidth = 1.5;
      ctx.strokeRect(42, 42, 916, 1316);

      const titleGrad = ctx.createLinearGradient(300, 0, 700, 0);
      titleGrad.addColorStop(0, GOLD);
      titleGrad.addColorStop(0.5, GOLD_LIGHT);
      titleGrad.addColorStop(1, GOLD);
      ctx.fillStyle = titleGrad;
      ctx.font = 'bold 58px Tajawal, Arial';
      ctx.textAlign = 'center';
      ctx.fillText(eventData.name, 500, 118);

      ctx.fillStyle = '#999';
      ctx.font = '34px Tajawal, Arial';
      ctx.fillText(eventData.date || '', 500, 172);

      drawFadedLine(ctx, 280, 720, 205, GOLD);

      const qx = 180, qy = 232, qw = 640, qh = 640, rr = 28;
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(qx + rr, qy);
      ctx.arcTo(qx + qw, qy, qx + qw, qy + qh, rr);
      ctx.arcTo(qx + qw, qy + qh, qx, qy + qh, rr);
      ctx.arcTo(qx, qy + qh, qx, qy, rr);
      ctx.arcTo(qx, qy, qx + qw, qy, rr);
      ctx.closePath();
      ctx.fillStyle = '#FFFFFF';
      ctx.shadowColor = 'rgba(0,0,0,0.10)';
      ctx.shadowBlur = 24;
      ctx.shadowOffsetY = 6;
      ctx.fill();
      ctx.restore();
      ctx.strokeStyle = hexToRgba(GOLD, 0.5);
      ctx.lineWidth = 1.5;
      ctx.stroke();

      ctx.drawImage(qr, 220, 272, 560, 560);

      ctx.fillStyle = '#0A0A0A';
      ctx.font = 'bold 54px Tajawal, Arial';
      ctx.fillText(guest.name, 500, 940);

      ctx.fillStyle = '#B0AAA0';
      ctx.font = '28px "Playfair Display", Arial';
      ctx.fillText(guest.id, 500, 992);

      drawFadedLine(ctx, 220, 780, 1028, 'rgba(0,0,0,0.18)');

      if (eventData.venue) {
        ctx.fillStyle = GOLD;
        ctx.font = 'bold 38px "Playfair Display", Arial';
        ctx.fillText(eventData.venue, 500, 1088);
        ctx.strokeStyle = hexToRgba(GOLD, 0.55);
        ctx.lineWidth = 1.2;
        ctx.beginPath(); ctx.moveTo(300, 1076); ctx.lineTo(360, 1076); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(640, 1076); ctx.lineTo(700, 1076); ctx.stroke();
      }

      ctx.fillStyle = '#888';
      ctx.font = '26px Tajawal, Arial';
      ctx.fillText('هذا الباركود لشخص واحد فقط', 500, 1148);
      ctx.fillStyle = '#666';
      ctx.font = '24px Tajawal, Arial';
      ctx.fillText('احتفظ بهذا الباركود للدخول وإبرازه عند البوابة', 500, 1200);

      drawSparkle(ctx, 92, 92, 16, GOLD);
      drawSparkle(ctx, 908, 92, 16, GOLD);
      drawSparkle(ctx, 92, 1308, 16, GOLD);
      drawSparkle(ctx, 908, 1308, 16, GOLD);

      document.body.removeChild(tmp);
      resolve(c);
    });
  });
}

let cardCanvas = null;
let cardGuestName = '';

async function downloadInviteCard() {
  if (!cardCanvas) return;
  const safeName = String(cardGuestName).trim().replace(/[\s\/\\:*?"<>|]+/g, '_');
  const fileName = 'Invitation-' + safeName + '.png';

  cardCanvas.toBlob(async (blob) => {
    if (!blob) return;
    try {
      const file = new File([blob], fileName, { type: 'image/png' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: cardGuestName });
        return;
      }
    } catch (e) {
      if (e && e.name === 'AbortError') return;
    }
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.download = fileName;
    link.href = url;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  }, 'image/png');
}

async function renderApproved(eventData, guest) {
  card.innerHTML = `
    <div class="status-icon">🎉</div>
    <div class="status-msg">تم تأكيد حضورك!</div>
    <div id="card-wrap" style="margin-top:16px;"></div>
    <button class="btn" id="save-btn" style="margin-top:14px; display:none;" onclick="downloadInviteCard()">⬇️ حفظ الدعوة</button>
  `;
  const built = await buildInviteCard(eventData, guest);
  if (!built) return;
  cardCanvas = built;
  cardGuestName = guest.name;
  const img = document.createElement('img');
  img.src = built.toDataURL('image/png');
  img.style.cssText = 'width:100%; border-radius:14px; box-shadow:0 8px 30px rgba(0,0,0,0.4);';
  document.getElementById('card-wrap').appendChild(img);
  document.getElementById('save-btn').style.display = 'block';
}

let currentEvent = null;

function watchStatus() {
  const { query, where, collection, onSnapshot } = window._fsFns;
  onSnapshot(query(collection(window._db, 'events', eventId, 'requests'), where('reqId', '==', myReqId)), (snap) => {
    if (snap.empty) return;
    const req = snap.docs[0].data();
    if (req.status === 'pending') renderPending();
    else if (req.status === 'rejected') renderRejected();
    else if (req.status === 'approved') {
      onSnapshot(query(collection(window._db, 'events', eventId, 'guests'), where('reqId', '==', myReqId)), (gsnap) => {
        if (!gsnap.empty) renderApproved(currentEvent, gsnap.docs[0].data());
        else renderPending();
      });
    }
  });
}

async function init() {
  if (!eventId) { card.innerHTML = '<div class="status-msg">⚠️ رابط غير صحيح</div>'; return; }
  const { doc, getDoc } = window._fsFns;
  const snap = await getDoc(doc(window._db, 'events', eventId));
  if (!snap.exists()) { card.innerHTML = '<div class="status-msg">⚠️ هذه المناسبة غير موجودة</div>'; return; }
  currentEvent = snap.data();
  document.body.setAttribute('data-theme', currentEvent.theme || 'gold');

  if (myReqId) watchStatus();
  else renderForm(currentEvent);
}

if (window._db) init();
else window.addEventListener('appDbReady', init);
</script>
</body>
</html>
