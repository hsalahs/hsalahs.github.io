<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نقل البيانات</title>
<style>
  body { font-family: system-ui, Arial; background:#0A0A0A; color:#FAF8F4; padding:20px; max-width:600px; margin:0 auto; }
  h1 { font-size:20px; color:#E0BC7A; }
  button { background:#E0BC7A; color:#2a1d05; border:none; padding:14px 24px; border-radius:10px; font-size:16px; font-weight:700; cursor:pointer; width:100%; margin-top:16px; }
  button:disabled { opacity:0.5; }
  #log { margin-top:20px; background:#151310; border-radius:10px; padding:14px; font-family:monospace; font-size:13px; white-space:pre-wrap; max-height:60vh; overflow-y:auto; line-height:1.6; }
  .ok { color:#7CD992; }
  .err { color:#E07A7A; }
  .warn { color:#E0BC7A; }
</style>
</head>
<body>

<h1>🔄 نقل البيانات — من المشروع القديم للجديد</h1>
<p>هذي أداة تشتغل مرة وحدة بس. تنسخ كل ضيف وطلب من قاعدة البيانات القديمة للجديدة بنفس المعرّفات بالضبط، بدون ما تحذف أو تغيّر شي بالقديم.</p>

<button id="startBtn" onclick="startMigration()">🚀 ابدأ النقل</button>

<div id="log"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, collection, getDocs, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  // OLD project (source — never modified)
  const oldConfig = {
    apiKey: "AIzaSyAeygMBPsJdXO76susC4Tk5rwTfZLUq5VE",
    authDomain: "wedding-qr-27f3c.firebaseapp.com",
    projectId: "wedding-qr-27f3c",
    storageBucket: "wedding-qr-27f3c.firebasestorage.app",
    messagingSenderId: "149053298560",
    appId: "1:149053298560:web:b93d2395bcb0e51d7a9365"
  };

  // NEW project (destination)
  const newConfig = {
    apiKey: "AIzaSyDbjJtLLDniHbALfUhzQ-UiN2j5txR8PGM",
    authDomain: "wedding-qr-16d01.firebaseapp.com",
    projectId: "wedding-qr-16d01",
    storageBucket: "wedding-qr-16d01.firebasestorage.app",
    messagingSenderId: "1036657421971",
    appId: "1:1036657421971:web:7ac5618871ec061fba6766"
  };

  const oldApp = initializeApp(oldConfig, "old");
  const newApp = initializeApp(newConfig, "new");
  const oldDb = getFirestore(oldApp);
  const newDb = getFirestore(newApp);

  const logEl = document.getElementById('log');
  function log(msg, cls) {
    const line = document.createElement('div');
    if (cls) line.className = cls;
    line.textContent = msg;
    logEl.appendChild(line);
    logEl.scrollTop = logEl.scrollHeight;
  }

  async function copyCollection(name) {
    log(`\n📂 نسخ مجموعة: ${name} ...`);
    const snap = await getDocs(collection(oldDb, name));
    log(`   وجدت ${snap.size} سجل بالقديم`);
    let done = 0;
    for (const docSnap of snap.docs) {
      await setDoc(doc(newDb, name, docSnap.id), docSnap.data());
      done++;
      if (done % 25 === 0) log(`   ...${done}/${snap.size}`);
    }
    log(`   ✅ خلصت نسخ ${done} سجل من ${name}`, 'ok');
    return done;
  }

  window.startMigration = async function() {
    const btn = document.getElementById('startBtn');
    btn.disabled = true;
    btn.textContent = '⏳ جاري النقل...';
    try {
      const guestsCount = await copyCollection('guests');
      const requestsCount = await copyCollection('requests');

      // settings/app holds the theme — copy it too if it exists
      try {
        const settingsSnap = await getDocs(collection(oldDb, 'settings'));
        for (const s of settingsSnap.docs) {
          await setDoc(doc(newDb, 'settings', s.id), s.data());
        }
        log(`\n✅ نسخ إعدادات الثيم أيضاً`, 'ok');
      } catch(e) { /* settings collection might not exist, that's fine */ }

      log(`\n🎉 خلص النقل بنجاح!`, 'ok');
      log(`   ${guestsCount} ضيف، ${requestsCount} طلب`, 'ok');
      log(`\n⚠️ تأكد الآن: جرب مسح باركود قديم على المشروع الجديد قبل ما تعتمد عليه.`, 'warn');
      btn.textContent = '✅ خلص النقل';
    } catch (e) {
      log(`\n❌ صار خطأ: ${e.message}`, 'err');
      log('القديم ما تأثر أبداً — جرب مرة ثانية أو راسل الدعم بهذا الخطأ.', 'warn');
      btn.disabled = false;
      btn.textContent = '🚀 ابدأ النقل';
    }
  };
</script>

</body>
</html>
