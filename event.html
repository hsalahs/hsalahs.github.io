<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة المناسبة | دعوات</title>
<script src="https://unpkg.com/qr-scanner@1.4.2/qr-scanner.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import {
    getFirestore, doc, getDoc, collection, addDoc, onSnapshot,
    updateDoc, deleteDoc, runTransaction, query, where
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDbjJtLLDniHbALfUhzQ-UiN2j5txR8PGM",
    authDomain: "wedding-qr-16d01.firebaseapp.com",
    projectId: "wedding-qr-16d01",
    storageBucket: "wedding-qr-16d01.firebasestorage.app",
    messagingSenderId: "1036657421971",
    appId: "1:1036657421971:web:7ac5618871ec061fba6766"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  window._auth = auth;
  window._db = db;
  window._authFns = { onAuthStateChanged, signOut };
  window._fsFns = { doc, getDoc, collection, addDoc, onSnapshot, updateDoc, deleteDoc, runTransaction, query, where };
  window.dispatchEvent(new Event('appDbReady'));
</script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Tajawal:wght@400;500;700&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Tajawal',sans-serif; background:#0A0A0A; color:#FAF8F4; min-height:100vh; }
  .wrap { max-width:520px; margin:0 auto; padding:20px 16px 60px; }
  .topbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
  h1 { font-family:'Playfair Display',serif; color:#E0BC7A; font-size:20px; }
  .sub { color:#B8B4AC; font-size:12px; margin-bottom:16px; }
  .msg { text-align:center; padding:60px 20px; color:#B8B4AC; }
  nav { display:flex; gap:8px; margin-bottom:16px; }
  .nav-btn { flex:1; padding:10px; border-radius:30px; border:1px solid rgba(224,188,122,0.3); background:transparent; color:#B8B4AC; font-family:inherit; font-size:13px; cursor:pointer; }
  .nav-btn.active { background:linear-gradient(135deg,#C99B4A,#E0BC7A); color:#1a1400; font-weight:700; border-color:transparent; }
  .page { display:none; }
  .page.active { display:block; }
  .card { background:rgba(255,255,255,0.04); border:1px solid rgba(224,188,122,0.2); border-radius:14px; padding:16px; margin-bottom:12px; }
  input { width:100%; padding:12px; margin-bottom:10px; border-radius:10px; background:rgba(255,255,255,0.04); border:1px solid rgba(224,188,122,0.25); color:#FAF8F4; font-size:14px; font-family:inherit; }
  .btn { padding:11px 16px; border:none; border-radius:10px; background:linear-gradient(135deg,#C99B4A,#E0BC7A); color:#1a1400; font-weight:700; font-size:13px; cursor:pointer; }
  .btn.ghost { background:transparent; border:1px solid rgba(224,188,122,0.3); color:#E0BC7A; }
  .btn.danger { background:transparent; border:1px solid rgba(255,120,120,0.4); color:#ff9d9d; }
  .row { display:flex; gap:8px; flex-wrap:wrap; }
  .guest-row { display:flex; align-items:center; padding:12px 0; border-bottom:1px solid rgba(255,255,255,0.06); gap:10px; flex-wrap:wrap; }
  .guest-row:last-child { border-bottom:none; }
  .g-num { color:#6f6a62; font-size:12px; min-width:20px; }
  .g-info { flex:1; min-width:120px; }
  .g-name { font-size:14px; }
  .g-id { color:#6f6a62; font-size:11px; margin-top:2px; }
  .g-actions { display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
  .btn.xs { padding:6px 10px; font-size:11px; border-radius:8px; }
  .badge { font-size:11px; padding:3px 10px; border-radius:20px; }
  .badge.ok { background:rgba(90,200,120,0.15); color:#7bd894; }
  .badge.pending { background:rgba(255,255,255,0.06); color:#B8B4AC; }
  #camera-video { width:100%; max-width:320px; margin:0 auto; aspect-ratio:1; object-fit:cover; border-radius:12px; background:#000; display:block; }
  #scan-result { text-align:center; padding:14px; border-radius:12px; margin-top:10px; font-weight:700; display:none; }
  #scan-result.ok { background:rgba(90,200,120,0.15); color:#7bd894; display:block; }
  #scan-result.bad { background:rgba(255,90,90,0.15); color:#ff9d9d; display:block; }
  .link-box { display:flex; gap:8px; align-items:center; }
  .link-box input { flex:1; margin:0; font-size:12px; }
  .empty { text-align:center; color:#6f6a62; font-size:13px; padding:14px 0; }
</style>
</head>
<body>
<div class="wrap">
  <div id="loading-msg" class="msg">جاري التحميل...</div>
  <div id="denied-msg" class="msg" style="display:none">🚫 غير مصرح لك بالوصول لهذه المناسبة</div>

  <div id="dashboard" style="display:none">
    <div class="topbar">
      <h1 id="ev-title"></h1>
      <a class="btn ghost" href="app.html" style="text-decoration:none">مناسباتي</a>
    </div>
    <div class="sub" id="ev-sub"></div>

    <div class="card">
      <div style="font-size:12px; color:#B8B4AC; margin-bottom:6px;">رابط الدعوة — شاركه مع ضيوفك</div>
      <div class="link-box">
        <input type="text" id="invite-link" readonly>
        <button class="btn" onclick="copyInviteLink()">نسخ</button>
      </div>
    </div>

    <nav>
      <button class="nav-btn active" onclick="showTab('scan', this)">📱 مسح</button>
      <button class="nav-btn" onclick="showTab('guests', this)">👥 الضيوف</button>
      <button class="nav-btn" onclick="showTab('requests', this)">📥 الطلبات</button>
    </nav>

    <div class="page active" id="page-scan">
      <div class="card">
        <p id="camera-status" style="color:#B8B4AC; font-size:13px; text-align:center; margin-bottom:10px;">اضغط لتشغيل الكاميرا</p>
        <button class="btn" id="start-cam-btn" onclick="startCamera()" style="width:100%">📷 تشغيل الكاميرا</button>
        <video id="camera-video" autoplay playsinline muted style="display:none"></video>
        <div id="scan-result"></div>
      </div>
    </div>

    <div class="page" id="page-guests">
      <div class="card">
        <div class="row">
          <input type="text" id="new-guest-name" placeholder="اسم ضيف جديد">
          <button class="btn" onclick="addGuest()">إضافة</button>
        </div>
      </div>
      <div class="card" id="guests-list"></div>
    </div>

    <div class="page" id="page-requests">
      <div class="card" id="requests-list"></div>
    </div>
  </div>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const eventId = params.get('id');
let eventData = null;
let guests = [];
let requests = [];
let qrScanner = null;
let lastScanned = null;
let scanCooldown = false;

function escapeHtml(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function showTab(name, btn) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('page-' + name).classList.add('active');
  btn.classList.add('active');
}

function copyInviteLink() {
  const input = document.getElementById('invite-link');
  input.select();
  navigator.clipboard?.writeText(input.value);
}

async function init() {
  if (!eventId) {
    document.getElementById('loading-msg').textContent = '⚠️ رابط غير صحيح — ما فيه رقم مناسبة';
    return;
  }
  const { onAuthStateChanged } = window._authFns;
  onAuthStateChanged(window._auth, async (user) => {
    if (!user) {
      document.getElementById('loading-msg').style.display = 'none';
      document.getElementById('denied-msg').style.display = 'block';
      document.getElementById('denied-msg').innerHTML = 'لازم تسجّل دخول الأول — <a href="app.html" style="color:#E0BC7A">اضغط هنا</a>';
      return;
    }
    const { doc, getDoc } = window._fsFns;
    const snap = await getDoc(doc(window._db, 'events', eventId));
    if (!snap.exists() || snap.data().ownerUid !== user.uid) {
      document.getElementById('loading-msg').style.display = 'none';
      document.getElementById('denied-msg').style.display = 'block';
      return;
    }
    eventData = snap.data();
    document.getElementById('loading-msg').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    document.getElementById('ev-title').textContent = eventData.name;
    document.getElementById('ev-sub').textContent = [eventData.date, eventData.venue].filter(Boolean).join(' · ');
    document.getElementById('invite-link').value = window.location.origin + window.location.pathname.replace('event.html', 'invite.html') + '?event=' + eventId;
    startListeners();
  });
}

function startListeners() {
  const { collection, onSnapshot } = window._fsFns;
  onSnapshot(collection(window._db, 'events', eventId, 'guests'), (snap) => {
    guests = snap.docs.map(d => ({ docId: d.id, ...d.data() }));
    renderGuests();
  });
  onSnapshot(collection(window._db, 'events', eventId, 'requests'), (snap) => {
    requests = snap.docs.map(d => ({ docId: d.id, ...d.data() })).filter(r => r.status === 'pending');
    renderRequests();
  });
}

function renderGuests() {
  const el = document.getElementById('guests-list');
  if (guests.length === 0) { el.innerHTML = '<div class="empty">لسه ما فيه ضيوف</div>'; return; }
  el.innerHTML = guests.map((g, i) => `
    <div class="guest-row">
      <span class="g-num">${i + 1}</span>
      <div class="g-info">
        <div class="g-name">${escapeHtml(g.name)}</div>
        <div class="g-id">${escapeHtml(g.id)}</div>
      </div>
      <div class="g-actions">
        <span class="badge ${g.scanned ? 'ok' : 'pending'}">${g.scanned ? '✓ حضر' : 'لسه'}</span>
        <button class="btn ghost xs" onclick="downloadGuestCard('${g.docId}')">💾 حفظ</button>
        ${g.scanned
          ? `<button class="btn ghost xs" onclick="undoGuestAttend('${g.docId}')">↩️ تراجع</button>`
          : `<button class="btn xs" onclick="markGuestAttend('${g.docId}')">✓ حضر</button>`}
        <button class="btn danger xs" onclick="deleteGuest('${g.docId}', '${escapeHtml(g.name).replace(/'/g, "\\'")}')">🗑</button>
      </div>
    </div>
  `).join('');
}

async function markGuestAttend(docId) {
  const { doc, updateDoc } = window._fsFns;
  try {
    await updateDoc(doc(window._db, 'events', eventId, 'guests', docId), { scanned: true, scannedAt: new Date().toISOString() });
  } catch (e) { showErr(e); }
}

async function undoGuestAttend(docId) {
  const { doc, updateDoc } = window._fsFns;
  try {
    await updateDoc(doc(window._db, 'events', eventId, 'guests', docId), { scanned: false, scannedAt: null });
  } catch (e) { showErr(e); }
}

async function deleteGuest(docId, name) {
  if (!confirm('حذف "' + name + '" نهائيًا؟')) return;
  const { doc, deleteDoc } = window._fsFns;
  try {
    await deleteDoc(doc(window._db, 'events', eventId, 'guests', docId));
  } catch (e) { showErr(e); }
}

function hexToRgba(hex, alpha) {
  const h = hex.replace('#', '');
  const r = parseInt(h.substring(0, 2), 16);
  const g = parseInt(h.substring(2, 4), 16);
  const b = parseInt(h.substring(4, 6), 16);
  return 'rgba(' + r + ',' + g + ',' + b + ',' + alpha + ')';
}

function drawSparkle(ctx, x, y, size, color) {
  ctx.save();
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(x, y - size);
  ctx.lineTo(x + size * 0.28, y - size * 0.28);
  ctx.lineTo(x + size, y);
  ctx.lineTo(x + size * 0.28, y + size * 0.28);
  ctx.lineTo(x, y + size);
  ctx.lineTo(x - size * 0.28, y + size * 0.28);
  ctx.lineTo(x - size, y);
  ctx.lineTo(x - size * 0.28, y - size * 0.28);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function drawFadedLine(ctx, x1, x2, y, color) {
  const g = ctx.createLinearGradient(x1, y, x2, y);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(0.5, color);
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.strokeStyle = g;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(x1, y); ctx.lineTo(x2, y);
  ctx.stroke();
}

function buildGuestCard(guest) {
  return new Promise((resolve) => {
    const GOLD = '#C9A84C';
    const GOLD_LIGHT = '#E0BC7A';

    const tmp = document.createElement('div');
    tmp.style.cssText = 'position:fixed;left:-9999px;top:-9999px;background:white;padding:12px;';
    document.body.appendChild(tmp);

    new QRCode(tmp, {
      text: guest.id, width: 400, height: 400,
      colorDark: '#0A0A0A', colorLight: '#FAFAF8',
      correctLevel: QRCode.CorrectLevel.H
    });

    function waitForQr(retriesLeft) {
      const qr = tmp.querySelector('canvas');
      if (qr) return Promise.resolve(qr);
      if (retriesLeft <= 0) return Promise.resolve(null);
      return new Promise(r => setTimeout(r, 100)).then(() => waitForQr(retriesLeft - 1));
    }

    waitForQr(30).then((qr) => new Promise(r => setTimeout(() => r(qr), 80))).then((qr) => {
      if (!qr) { document.body.removeChild(tmp); resolve(null); return; }

      const c = document.createElement('canvas');
      c.width = 1000; c.height = 1400;
      const ctx = c.getContext('2d');

      ctx.fillStyle = '#FAFAF8';
      ctx.fillRect(0, 0, 1000, 1400);

      const glow = ctx.createRadialGradient(500, 530, 60, 500, 530, 520);
      glow.addColorStop(0, hexToRgba(GOLD, 0.10));
      glow.addColorStop(1, hexToRgba(GOLD, 0));
      ctx.fillStyle = glow;
      ctx.fillRect(0, 150, 1000, 800);

      ctx.fillStyle = GOLD;
      ctx.fillRect(0, 0, 1000, 22);
      ctx.fillRect(0, 1378, 1000, 22);
      ctx.fillRect(0, 0, 6, 1400);
      ctx.fillRect(994, 0, 6, 1400);

      ctx.strokeStyle = hexToRgba(GOLD, 0.35);
      ctx.lineWidth = 1.5;
      ctx.strokeRect(42, 42, 916, 1316);

      const titleGrad = ctx.createLinearGradient(300, 0, 700, 0);
      titleGrad.addColorStop(0, GOLD);
      titleGrad.addColorStop(0.5, GOLD_LIGHT);
      titleGrad.addColorStop(1, GOLD);
      ctx.fillStyle = titleGrad;
      ctx.font = 'bold 58px Tajawal, Arial';
      ctx.textAlign = 'center';
      ctx.fillText(eventData.name, 500, 118);

      ctx.fillStyle = '#999';
      ctx.font = '34px Tajawal, Arial';
      ctx.fillText(eventData.date || '', 500, 172);

      drawFadedLine(ctx, 280, 720, 205, GOLD);

      const qx = 180, qy = 232, qw = 640, qh = 640, rr = 28;
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(qx + rr, qy);
      ctx.arcTo(qx + qw, qy, qx + qw, qy + qh, rr);
      ctx.arcTo(qx + qw, qy + qh, qx, qy + qh, rr);
      ctx.arcTo(qx, qy + qh, qx, qy, rr);
      ctx.arcTo(qx, qy, qx + qw, qy, rr);
      ctx.closePath();
      ctx.fillStyle = '#FFFFFF';
      ctx.shadowColor = 'rgba(0,0,0,0.10)';
      ctx.shadowBlur = 24;
      ctx.shadowOffsetY = 6;
      ctx.fill();
      ctx.restore();
      ctx.strokeStyle = hexToRgba(GOLD, 0.5);
      ctx.lineWidth = 1.5;
      ctx.stroke();

      ctx.drawImage(qr, 220, 272, 560, 560);

      ctx.fillStyle = '#0A0A0A';
      ctx.font = 'bold 54px Tajawal, Arial';
      ctx.fillText(guest.name, 500, 940);

      ctx.fillStyle = '#B0AAA0';
      ctx.font = '28px "Playfair Display", Arial';
      ctx.fillText(guest.id, 500, 992);

      drawFadedLine(ctx, 220, 780, 1028, 'rgba(0,0,0,0.18)');

      if (eventData.venue) {
        ctx.fillStyle = GOLD;
        ctx.font = 'bold 38px "Playfair Display", Arial';
        ctx.fillText(eventData.venue, 500, 1088);
        ctx.strokeStyle = hexToRgba(GOLD, 0.55);
        ctx.lineWidth = 1.2;
        ctx.beginPath(); ctx.moveTo(300, 1076); ctx.lineTo(360, 1076); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(640, 1076); ctx.lineTo(700, 1076); ctx.stroke();
      }

      ctx.fillStyle = '#888';
      ctx.font = '26px Tajawal, Arial';
      ctx.fillText('هذا الباركود لشخص واحد فقط', 500, 1148);
      ctx.fillStyle = '#666';
      ctx.font = '24px Tajawal, Arial';
      ctx.fillText('احتفظ بهذا الباركود للدخول وإبرازه عند البوابة', 500, 1200);

      drawSparkle(ctx, 92, 92, 16, GOLD);
      drawSparkle(ctx, 908, 92, 16, GOLD);
      drawSparkle(ctx, 92, 1308, 16, GOLD);
      drawSparkle(ctx, 908, 1308, 16, GOLD);

      document.body.removeChild(tmp);
      resolve(c);
    });
  });
}

async function downloadGuestCard(docId) {
  const guest = guests.find(g => g.docId === docId);
  if (!guest) return;
  const built = await buildGuestCard(guest);
  if (!built) { alert('تعذّر إنشاء البطاقة'); return; }

  const safeName = String(guest.name).trim().replace(/[\s\/\\:*?"<>|]+/g, '_');
  const fileName = 'Invitation-' + safeName + '.png';

  built.toBlob(async (blob) => {
    if (!blob) return;
    try {
      const file = new File([blob], fileName, { type: 'image/png' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: guest.name });
        return;
      }
    } catch (e) {
      if (e && e.name === 'AbortError') return;
    }
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.download = fileName;
    link.href = url;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  }, 'image/png');
}

function renderRequests() {
  const el = document.getElementById('requests-list');
  if (requests.length === 0) { el.innerHTML = '<div class="empty">مافيه طلبات جديدة</div>'; return; }
  el.innerHTML = requests.map(r => `
    <div class="guest-row">
      <span class="g-name">${escapeHtml(r.name)}</span>
      <div class="row">
        <button class="btn" onclick="approveRequest('${r.docId}')">قبول</button>
        <button class="btn danger" onclick="rejectRequest('${r.docId}')">رفض</button>
      </div>
    </div>
  `).join('');
}

function newGuestId() {
  return 'WD-' + Math.random().toString(36).substr(2, 9).toUpperCase() + Date.now().toString(36).toUpperCase().substr(-4);
}

function showErr(e) {
  alert('صار خطأ: ' + (e.code || '') + ' — ' + e.message);
  console.error(e);
}

async function addGuest() {
  const nameInput = document.getElementById('new-guest-name');
  const name = nameInput.value.trim();
  if (!name) return;
  const { collection, addDoc } = window._fsFns;
  try {
    await addDoc(collection(window._db, 'events', eventId, 'guests'), {
      id: newGuestId(), name, scanned: false, registeredAt: new Date().toISOString()
    });
    nameInput.value = '';
  } catch (e) { showErr(e); }
}

async function approveRequest(reqDocId) {
  const req = requests.find(r => r.docId === reqDocId);
  if (!req) return;
  const { collection, addDoc, doc, updateDoc } = window._fsFns;
  try {
    await addDoc(collection(window._db, 'events', eventId, 'guests'), {
      id: newGuestId(), name: req.name, reqId: req.reqId, scanned: false, registeredAt: new Date().toISOString()
    });
    await updateDoc(doc(window._db, 'events', eventId, 'requests', reqDocId), { status: 'approved' });
  } catch (e) { showErr(e); }
}

async function rejectRequest(reqDocId) {
  const { doc, updateDoc } = window._fsFns;
  try {
    await updateDoc(doc(window._db, 'events', eventId, 'requests', reqDocId), { status: 'rejected' });
  } catch (e) { showErr(e); }
}

async function startCamera() {
  const video = document.getElementById('camera-video');
  const status = document.getElementById('camera-status');
  status.textContent = 'جاري تشغيل الكاميرا...';

  let retries = 2;
  while (retries >= 0) {
    try {
      qrScanner = new QrScanner(video, result => {
        if (!scanCooldown) handleScan(result.data);
      }, { returnDetailedScanResult: true, preferredCamera: 'environment' });
      await qrScanner.start();
      video.style.display = 'block';
      document.getElementById('start-cam-btn').style.display = 'none';
      status.textContent = 'وجّه الكاميرا نحو الباركود';
      return;
    } catch (e) {
      if (qrScanner) { try { qrScanner.destroy(); } catch (_) {} qrScanner = null; }
      retries--;
      if (retries < 0) {
        status.textContent = '⚠️ ما قدرنا نفتح الكاميرا — تحقق من صلاحيات الكاميرا بإعدادات المتصفح';
      } else {
        status.textContent = 'إعادة المحاولة...';
        await new Promise(r => setTimeout(r, 800));
      }
    }
  }
}

async function handleScan(raw) {
  const match = raw.trim().toUpperCase().match(/WD-[A-Z0-9]+/);
  if (!match) return;
  const val = match[0];
  if (val === lastScanned) return;
  lastScanned = val;
  scanCooldown = true;

  const resultEl = document.getElementById('scan-result');
  const found = guests.find(g => g.id === val);

  if (!found) {
    resultEl.className = 'bad';
    resultEl.textContent = '❌ باركود غير مسجّل';
  } else {
    const { doc, runTransaction } = window._fsFns;
    const gRef = doc(window._db, 'events', eventId, 'guests', found.docId);
    const outcome = await runTransaction(window._db, async (tx) => {
      const snap = await tx.get(gRef);
      if (!snap.exists()) return 'missing';
      if (snap.data().scanned) return 'dup';
      tx.update(gRef, { scanned: true, scannedAt: new Date().toISOString() });
      return 'ok';
    });
    if (outcome === 'ok') {
      resultEl.className = 'ok';
      resultEl.textContent = '✅ ' + found.name + ' — مسموح';
    } else if (outcome === 'dup') {
      resultEl.className = 'bad';
      resultEl.textContent = '⚠️ ' + found.name + ' — دخل قبل كذا';
    }
  }

  setTimeout(() => { resultEl.style.display = 'none'; scanCooldown = false; lastScanned = null; }, 2500);
}

if (window._auth) init();
else window.addEventListener('appDbReady', init);
</script>
</body>
</html>
