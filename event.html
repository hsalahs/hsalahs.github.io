<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة المناسبة | دعوات</title>
<script src="https://unpkg.com/qr-scanner@1.4.2/qr-scanner.umd.min.js"></script>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import {
    getFirestore, doc, getDoc, collection, addDoc, onSnapshot,
    updateDoc, deleteDoc, runTransaction, query, where
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDbjJtLLDniHbALfUhzQ-UiN2j5txR8PGM",
    authDomain: "wedding-qr-16d01.firebaseapp.com",
    projectId: "wedding-qr-16d01",
    storageBucket: "wedding-qr-16d01.firebasestorage.app",
    messagingSenderId: "1036657421971",
    appId: "1:1036657421971:web:7ac5618871ec061fba6766"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  window._auth = auth;
  window._db = db;
  window._authFns = { onAuthStateChanged, signOut };
  window._fsFns = { doc, getDoc, collection, addDoc, onSnapshot, updateDoc, deleteDoc, runTransaction, query, where };
  window.dispatchEvent(new Event('appDbReady'));
</script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Tajawal:wght@400;500;700&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Tajawal',sans-serif; background:#0A0A0A; color:#FAF8F4; min-height:100vh; }
  .wrap { max-width:520px; margin:0 auto; padding:20px 16px 60px; }
  .topbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
  h1 { font-family:'Playfair Display',serif; color:#E0BC7A; font-size:20px; }
  .sub { color:#B8B4AC; font-size:12px; margin-bottom:16px; }
  .msg { text-align:center; padding:60px 20px; color:#B8B4AC; }
  nav { display:flex; gap:8px; margin-bottom:16px; }
  .nav-btn { flex:1; padding:10px; border-radius:30px; border:1px solid rgba(224,188,122,0.3); background:transparent; color:#B8B4AC; font-family:inherit; font-size:13px; cursor:pointer; }
  .nav-btn.active { background:linear-gradient(135deg,#C99B4A,#E0BC7A); color:#1a1400; font-weight:700; border-color:transparent; }
  .page { display:none; }
  .page.active { display:block; }
  .card { background:rgba(255,255,255,0.04); border:1px solid rgba(224,188,122,0.2); border-radius:14px; padding:16px; margin-bottom:12px; }
  input { width:100%; padding:12px; margin-bottom:10px; border-radius:10px; background:rgba(255,255,255,0.04); border:1px solid rgba(224,188,122,0.25); color:#FAF8F4; font-size:14px; font-family:inherit; }
  .btn { padding:11px 16px; border:none; border-radius:10px; background:linear-gradient(135deg,#C99B4A,#E0BC7A); color:#1a1400; font-weight:700; font-size:13px; cursor:pointer; }
  .btn.ghost { background:transparent; border:1px solid rgba(224,188,122,0.3); color:#E0BC7A; }
  .btn.danger { background:transparent; border:1px solid rgba(255,120,120,0.4); color:#ff9d9d; }
  .row { display:flex; gap:8px; }
  .guest-row { display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid rgba(255,255,255,0.06); gap:8px; }
  .guest-row:last-child { border-bottom:none; }
  .g-name { font-size:14px; }
  .badge { font-size:11px; padding:3px 10px; border-radius:20px; }
  .badge.ok { background:rgba(90,200,120,0.15); color:#7bd894; }
  .badge.pending { background:rgba(255,255,255,0.06); color:#B8B4AC; }
  #camera-video { width:100%; border-radius:12px; }
  #scan-result { text-align:center; padding:14px; border-radius:12px; margin-top:10px; font-weight:700; display:none; }
  #scan-result.ok { background:rgba(90,200,120,0.15); color:#7bd894; display:block; }
  #scan-result.bad { background:rgba(255,90,90,0.15); color:#ff9d9d; display:block; }
  .link-box { display:flex; gap:8px; align-items:center; }
  .link-box input { flex:1; margin:0; font-size:12px; }
  .empty { text-align:center; color:#6f6a62; font-size:13px; padding:14px 0; }
</style>
</head>
<body>
<div class="wrap">
  <div id="loading-msg" class="msg">جاري التحميل...</div>
  <div id="denied-msg" class="msg" style="display:none">🚫 غير مصرح لك بالوصول لهذه المناسبة</div>

  <div id="dashboard" style="display:none">
    <div class="topbar">
      <h1 id="ev-title"></h1>
      <a class="btn ghost" href="app.html" style="text-decoration:none">مناسباتي</a>
    </div>
    <div class="sub" id="ev-sub"></div>

    <div class="card">
      <div style="font-size:12px; color:#B8B4AC; margin-bottom:6px;">رابط الدعوة — شاركه مع ضيوفك</div>
      <div class="link-box">
        <input type="text" id="invite-link" readonly>
        <button class="btn" onclick="copyInviteLink()">نسخ</button>
      </div>
    </div>

    <nav>
      <button class="nav-btn active" onclick="showTab('scan', this)">📱 مسح</button>
      <button class="nav-btn" onclick="showTab('guests', this)">👥 الضيوف</button>
      <button class="nav-btn" onclick="showTab('requests', this)">📥 الطلبات</button>
    </nav>

    <div class="page active" id="page-scan">
      <div class="card">
        <button class="btn" id="start-cam-btn" onclick="startCamera()">تشغيل الكاميرا</button>
        <video id="camera-video" style="display:none"></video>
        <div id="scan-result"></div>
      </div>
    </div>

    <div class="page" id="page-guests">
      <div class="card">
        <div class="row">
          <input type="text" id="new-guest-name" placeholder="اسم ضيف جديد">
          <button class="btn" onclick="addGuest()">إضافة</button>
        </div>
      </div>
      <div class="card" id="guests-list"></div>
    </div>

    <div class="page" id="page-requests">
      <div class="card" id="requests-list"></div>
    </div>
  </div>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const eventId = params.get('id');
let eventData = null;
let guests = [];
let requests = [];
let qrScanner = null;
let lastScanned = null;
let scanCooldown = false;

function escapeHtml(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function showTab(name, btn) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('page-' + name).classList.add('active');
  btn.classList.add('active');
}

function copyInviteLink() {
  const input = document.getElementById('invite-link');
  input.select();
  navigator.clipboard?.writeText(input.value);
}

async function init() {
  if (!eventId) {
    document.getElementById('loading-msg').textContent = '⚠️ رابط غير صحيح — ما فيه رقم مناسبة';
    return;
  }
  const { onAuthStateChanged } = window._authFns;
  onAuthStateChanged(window._auth, async (user) => {
    if (!user) {
      document.getElementById('loading-msg').style.display = 'none';
      document.getElementById('denied-msg').style.display = 'block';
      document.getElementById('denied-msg').innerHTML = 'لازم تسجّل دخول الأول — <a href="app.html" style="color:#E0BC7A">اضغط هنا</a>';
      return;
    }
    const { doc, getDoc } = window._fsFns;
    const snap = await getDoc(doc(window._db, 'events', eventId));
    if (!snap.exists() || snap.data().ownerUid !== user.uid) {
      document.getElementById('loading-msg').style.display = 'none';
      document.getElementById('denied-msg').style.display = 'block';
      return;
    }
    eventData = snap.data();
    document.getElementById('loading-msg').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    document.getElementById('ev-title').textContent = eventData.name;
    document.getElementById('ev-sub').textContent = [eventData.date, eventData.venue].filter(Boolean).join(' · ');
    document.getElementById('invite-link').value = window.location.origin + window.location.pathname.replace('event.html', 'invite.html') + '?event=' + eventId;
    startListeners();
  });
}

function startListeners() {
  const { collection, onSnapshot } = window._fsFns;
  onSnapshot(collection(window._db, 'events', eventId, 'guests'), (snap) => {
    guests = snap.docs.map(d => ({ docId: d.id, ...d.data() }));
    renderGuests();
  });
  onSnapshot(collection(window._db, 'events', eventId, 'requests'), (snap) => {
    requests = snap.docs.map(d => ({ docId: d.id, ...d.data() })).filter(r => r.status === 'pending');
    renderRequests();
  });
}

function renderGuests() {
  const el = document.getElementById('guests-list');
  if (guests.length === 0) { el.innerHTML = '<div class="empty">لسه ما فيه ضيوف</div>'; return; }
  el.innerHTML = guests.map(g => `
    <div class="guest-row">
      <span class="g-name">${escapeHtml(g.name)}</span>
      <span class="badge ${g.scanned ? 'ok' : 'pending'}">${g.scanned ? '✓ حضر' : 'لسه'}</span>
    </div>
  `).join('');
}

function renderRequests() {
  const el = document.getElementById('requests-list');
  if (requests.length === 0) { el.innerHTML = '<div class="empty">مافيه طلبات جديدة</div>'; return; }
  el.innerHTML = requests.map(r => `
    <div class="guest-row">
      <span class="g-name">${escapeHtml(r.name)}</span>
      <div class="row">
        <button class="btn" onclick="approveRequest('${r.docId}')">قبول</button>
        <button class="btn danger" onclick="rejectRequest('${r.docId}')">رفض</button>
      </div>
    </div>
  `).join('');
}

function newGuestId() {
  return 'WD-' + Math.random().toString(36).substr(2, 9).toUpperCase() + Date.now().toString(36).toUpperCase().substr(-4);
}

function showErr(e) {
  alert('صار خطأ: ' + (e.code || '') + ' — ' + e.message);
  console.error(e);
}

async function addGuest() {
  const nameInput = document.getElementById('new-guest-name');
  const name = nameInput.value.trim();
  if (!name) return;
  const { collection, addDoc } = window._fsFns;
  try {
    await addDoc(collection(window._db, 'events', eventId, 'guests'), {
      id: newGuestId(), name, scanned: false, registeredAt: new Date().toISOString()
    });
    nameInput.value = '';
  } catch (e) { showErr(e); }
}

async function approveRequest(reqDocId) {
  const req = requests.find(r => r.docId === reqDocId);
  if (!req) return;
  const { collection, addDoc, doc, updateDoc } = window._fsFns;
  try {
    await addDoc(collection(window._db, 'events', eventId, 'guests'), {
      id: newGuestId(), name: req.name, reqId: req.reqId, scanned: false, registeredAt: new Date().toISOString()
    });
    await updateDoc(doc(window._db, 'events', eventId, 'requests', reqDocId), { status: 'approved' });
  } catch (e) { showErr(e); }
}

async function rejectRequest(reqDocId) {
  const { doc, updateDoc } = window._fsFns;
  try {
    await updateDoc(doc(window._db, 'events', eventId, 'requests', reqDocId), { status: 'rejected' });
  } catch (e) { showErr(e); }
}

async function startCamera() {
  const video = document.getElementById('camera-video');
  try {
    qrScanner = new QrScanner(video, result => {
      if (!scanCooldown) handleScan(result.data);
    }, { returnDetailedScanResult: true, preferredCamera: 'environment' });
    await qrScanner.start();
    video.style.display = 'block';
    document.getElementById('start-cam-btn').style.display = 'none';
  } catch (e) {
    alert('ما قدرنا نفتح الكاميرا — تحقق من الصلاحيات');
  }
}

async function handleScan(raw) {
  const match = raw.trim().toUpperCase().match(/WD-[A-Z0-9]+/);
  if (!match) return;
  const val = match[0];
  if (val === lastScanned) return;
  lastScanned = val;
  scanCooldown = true;

  const resultEl = document.getElementById('scan-result');
  const found = guests.find(g => g.id === val);

  if (!found) {
    resultEl.className = 'bad';
    resultEl.textContent = '❌ باركود غير مسجّل';
  } else {
    const { doc, runTransaction } = window._fsFns;
    const gRef = doc(window._db, 'events', eventId, 'guests', found.docId);
    const outcome = await runTransaction(window._db, async (tx) => {
      const snap = await tx.get(gRef);
      if (!snap.exists()) return 'missing';
      if (snap.data().scanned) return 'dup';
      tx.update(gRef, { scanned: true, scannedAt: new Date().toISOString() });
      return 'ok';
    });
    if (outcome === 'ok') {
      resultEl.className = 'ok';
      resultEl.textContent = '✅ ' + found.name + ' — مسموح';
    } else if (outcome === 'dup') {
      resultEl.className = 'bad';
      resultEl.textContent = '⚠️ ' + found.name + ' — دخل قبل كذا';
    }
  }

  setTimeout(() => { resultEl.style.display = 'none'; scanCooldown = false; lastScanned = null; }, 2500);
}

if (window._auth) init();
else window.addEventListener('appDbReady', init);
</script>
</body>
</html>
