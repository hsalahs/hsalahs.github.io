<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة المنظّم | دعوات</title>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import {
    getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword,
    onAuthStateChanged, signOut, sendPasswordResetEmail
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import {
    getFirestore, collection, addDoc, query, where, onSnapshot, serverTimestamp, doc, setDoc, getDoc, updateDoc, increment, runTransaction, getDocs, deleteDoc
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDbjJtLLDniHbALfUhzQ-UiN2j5txR8PGM",
    authDomain: "wedding-qr-16d01.firebaseapp.com",
    projectId: "wedding-qr-16d01",
    storageBucket: "wedding-qr-16d01.firebasestorage.app",
    messagingSenderId: "1036657421971",
    appId: "1:1036657421971:web:7ac5618871ec061fba6766"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const eventsCol = collection(db, 'events');

  window._auth = auth;
  window._db = db;
  window._eventsCol = eventsCol;
  window._authFns = { createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut, sendPasswordResetEmail };
  window._fsFns = { collection, addDoc, query, where, onSnapshot, serverTimestamp, doc, setDoc, getDoc, updateDoc, increment, runTransaction, getDocs, deleteDoc };
  window._readyEvent = new Event('appDbReady');
  window.dispatchEvent(window._readyEvent);
</script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Tajawal:wght@400;500;700&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Tajawal',sans-serif; background:#0A0A0A; color:#FAF8F4; min-height:100vh; }
  .wrap { max-width:480px; margin:0 auto; padding:32px 18px 60px; }
  h1 { font-family:'Playfair Display',serif; color:#E0BC7A; font-size:26px; text-align:center; margin-bottom:6px; }
  .sub { text-align:center; color:#B8B4AC; font-size:13px; margin-bottom:28px; }
  .card { background:rgba(255,255,255,0.04); border:1px solid rgba(224,188,122,0.2); border-radius:16px; padding:22px; margin-bottom:16px; }
  input { width:100%; padding:13px 14px; margin-bottom:12px; border-radius:10px; background:rgba(255,255,255,0.04); border:1px solid rgba(224,188,122,0.25); color:#FAF8F4; font-size:15px; font-family:inherit; }
  input:focus { outline:none; border-color:#E0BC7A; }
  .btn { width:100%; padding:13px; border:none; border-radius:10px; background:linear-gradient(135deg,#C99B4A,#E0BC7A); color:#1a1400; font-weight:700; font-size:15px; cursor:pointer; margin-bottom:10px; }
  .btn.ghost { background:transparent; border:1px solid rgba(224,188,122,0.3); color:#E0BC7A; }
  .btn.small { width:auto; padding:8px 16px; font-size:13px; }
  .toggle-row { text-align:center; font-size:13px; color:#B8B4AC; margin-top:4px; }
  .toggle-row a { color:#E0BC7A; cursor:pointer; text-decoration:underline; }
  .err { color:#ff9d9d; font-size:13px; margin-bottom:10px; text-align:center; }
  .event-card { display:flex; flex-direction:column; gap:12px; }
  .event-card-top { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .event-name { font-weight:700; color:#E0BC7A; font-size:15px; }
  .event-date { color:#B8B4AC; font-size:12px; margin-top:3px; }
  .event-stats { display:flex; gap:8px; }
  .event-stat { flex:1; text-align:center; background:rgba(224,188,122,0.06); border:1px solid rgba(224,188,122,0.15); border-radius:10px; padding:8px 4px; }
  .event-stat .n { font-weight:700; color:#FAF8F4; font-size:15px; }
  .event-stat .l { color:#8a857a; font-size:10.5px; margin-top:1px; }
  .event-actions { display:flex; gap:6px; }
  .topbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
  #hidden-forms > div { display:none; }
  .empty { text-align:center; color:#6f6a62; font-size:14px; padding:20px 0; }
  .badge-count { background:#F44336; color:#fff; font-size:11px; font-weight:700; min-width:18px; height:18px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; padding:0 4px; }
</style>
</head>
<body>
<div class="wrap">

  <div id="auth-view">
    <h1><a href="landing.html" style="color:inherit; text-decoration:none;">دعوات</a></h1>
    <div class="sub">لوحة تحكم المنظّمين — أنشئ دعوة رقمية لمناسبتك</div>
    <div class="card">
      <div id="auth-err" class="err" style="display:none"></div>
      <input type="email" id="auth-email" placeholder="البريد الإلكتروني">
      <input type="password" id="auth-pass" placeholder="كلمة المرور">
      <button class="btn" id="auth-submit-btn" onclick="submitAuth()">دخول</button>
      <div class="toggle-row" id="auth-toggle">ما عندك حساب؟ <a onclick="toggleAuthMode()">سجّل واحد جديد</a></div>
      <div class="toggle-row" id="forgot-pass-row"><a onclick="sendResetEmail()">نسيت كلمة المرور؟</a></div>
    </div>
  </div>

  <div id="app-view" style="display:none">
    <div class="topbar">
      <h1 style="margin:0; font-size:20px;" id="events-heading">مناسباتي</h1>
      <button class="btn ghost small" onclick="doLogout()">🔓 خروج</button>
    </div>
    <div class="sub" style="margin-bottom:20px;">
      مسجّل دخول بحساب: <span id="current-email" style="color:#E0BC7A"></span>
    </div>

    <div id="admin-requests-section" style="display:none; margin-bottom:16px;">
      <div class="sub" style="margin-bottom:8px; text-align:right; display:flex; align-items:center; justify-content:flex-end; gap:8px;">
        🙋 طلبات مناسبات إضافية
        <span class="badge-count" id="admin-requests-badge">0</span>
      </div>
      <div id="admin-requests-list"></div>
    </div>

    <button class="btn" id="create-toggle-btn" onclick="showCreateForm()" style="display:none">➕ إنشاء مناسبة جديدة</button>
    <div id="limit-box" style="display:none; margin-bottom:16px;">
      <div class="sub" id="limit-box-msg" style="margin-bottom:10px;">وصلت لحد مناسباتك الحالي.</div>
      <button class="btn ghost" id="request-more-btn" style="width:100%;">🙋 اطلب مناسبة إضافية</button>
      <div class="sub" id="pending-request-msg" style="display:none;">⏳ طلبك قيد المراجعة، بننبّهك أول ما يتم الرد.</div>
    </div>

    <div class="card" id="create-form" style="display:none">
      <input type="text" id="ev-name" placeholder="اسم المناسبة (مثال: عرس حسن وفاطمة)">
      <input type="date" id="ev-date" placeholder="التاريخ">
      <input type="text" id="ev-venue" placeholder="مكان الحفل">
      <button class="btn" onclick="createNewEvent()">إنشاء</button>
    </div>

    <div id="events-list"></div>
  </div>

</div>

<script>
const ADMIN_EMAILS = ['hsallah@outlook.sa'];
function isAdmin(user) { return !!user && ADMIN_EMAILS.includes((user.email || '').toLowerCase()); }

let authMode = 'login'; // or 'signup'

function toggleAuthMode() {
  authMode = authMode === 'login' ? 'signup' : 'login';
  document.getElementById('auth-submit-btn').textContent = authMode === 'login' ? 'دخول' : 'إنشاء حساب';
  document.getElementById('auth-toggle').innerHTML = authMode === 'login'
    ? 'ما عندك حساب؟ <a onclick="toggleAuthMode()">سجّل واحد جديد</a>'
    : 'عندك حساب؟ <a onclick="toggleAuthMode()">سجّل دخول</a>';
  document.getElementById('forgot-pass-row').style.display = authMode === 'login' ? 'block' : 'none';
}

async function sendResetEmail() {
  const email = document.getElementById('auth-email').value.trim();
  document.getElementById('auth-err').style.display = 'none';
  if (!email) { showAuthError('اكتب بريدك الإلكتروني فوق الأول، وبعدين اضغط "نسيت كلمة المرور"'); return; }
  const { sendPasswordResetEmail } = window._authFns;
  try {
    await sendPasswordResetEmail(window._auth, email);
    alert('تم إرسال رابط تغيير كلمة المرور إلى بريدك — تفقّد صندوق الوارد (والسبام لو ما وصلك).');
  } catch (e) {
    const map = {
      'auth/invalid-email': 'صيغة البريد غير صحيحة',
      'auth/user-not-found': 'ما فيه حساب مسجّل بهذا البريد'
    };
    showAuthError(map[e.code] || ('خطأ: ' + e.message));
  }
}

function showAuthError(msg) {
  const el = document.getElementById('auth-err');
  el.textContent = msg;
  el.style.display = 'block';
}

async function submitAuth() {
  const email = document.getElementById('auth-email').value.trim();
  const pass = document.getElementById('auth-pass').value;
  document.getElementById('auth-err').style.display = 'none';
  if (!email || !pass) { showAuthError('عبّي البريد وكلمة المرور'); return; }

  const { createUserWithEmailAndPassword, signInWithEmailAndPassword } = window._authFns;
  try {
    if (authMode === 'signup') {
      await createUserWithEmailAndPassword(window._auth, email, pass);
    } else {
      await signInWithEmailAndPassword(window._auth, email, pass);
    }
  } catch (e) {
    const map = {
      'auth/email-already-in-use': 'البريد مسجّل مسبقًا — جرب تسجّل دخول',
      'auth/invalid-credential': 'البريد أو كلمة المرور غلط',
      'auth/weak-password': 'كلمة المرور لازم تكون ٦ أحرف على الأقل',
      'auth/invalid-email': 'صيغة البريد غير صحيحة'
    };
    showAuthError(map[e.code] || ('خطأ: ' + e.message));
  }
}

function doLogout() {
  const { signOut } = window._authFns;
  signOut(window._auth);
}

function showCreateForm() {
  const f = document.getElementById('create-form');
  f.style.display = f.style.display === 'block' ? 'none' : 'block';
}

function newEventId() {
  return Math.random().toString(36).substr(2, 6) + Date.now().toString(36).substr(-4);
}

async function createNewEvent() {
  const name = document.getElementById('ev-name').value.trim();
  const date = document.getElementById('ev-date').value;
  const venue = document.getElementById('ev-venue').value.trim();
  if (!name) { alert('اكتب اسم المناسبة'); return; }

  const { serverTimestamp, doc, runTransaction } = window._fsFns;
  const eventId = newEventId();
  const scanPin = String(Math.floor(1000 + Math.random() * 9000)); // 4-digit PIN for the door/security team
  const user = window._auth.currentUser;
  const admin = isAdmin(user);
  const eventRef = doc(window._db, 'events', eventId);
  const limitRef = doc(window._db, 'accountLimits', user.uid);

  try {
    await runTransaction(window._db, async (tx) => {
      const eventData = {
        name, date, venue, scanPin,
        ownerUid: user.uid,
        ownerEmail: user.email || '',
        createdAt: serverTimestamp()
      };

      // The one-event-per-customer cap is enforced by Firestore's security
      // rules (see accountLimits/{uid}), not just this client-side check —
      // this transaction is what makes that enforcement atomic and race-safe.
      if (!admin) {
        const limitSnap = await tx.get(limitRef);
        if (!limitSnap.exists()) {
          tx.set(limitRef, { eventLimit: 1, eventCount: 1 });
        } else {
          const { eventCount = 0, eventLimit = 1 } = limitSnap.data();
          if (eventCount >= eventLimit) throw new Error('LIMIT_REACHED');
          tx.update(limitRef, { eventCount: eventCount + 1 });
        }
      }
      tx.set(eventRef, eventData);
    });
    window.location.href = 'event.html?id=' + eventId;
  } catch (e) {
    if (e.message === 'LIMIT_REACHED') {
      alert('عندك مناسبة وحدة مفعّلة على حسابك حاليًا. اطلب مناسبة إضافية من لوحتك.');
    } else {
      alert('صار خطأ: ' + (e.code || '') + ' — ' + e.message);
      console.error(e);
    }
  }
}

function renderEvents(events, showOwner) {
  const list = document.getElementById('events-list');
  if (events.length === 0) {
    list.innerHTML = '<div class="empty">لسه ما أنشأت أي مناسبة</div>';
    return;
  }
  list.innerHTML = events.map(ev => `
    <div class="card event-card">
      <div class="event-card-top">
        <div>
          <div class="event-name">${escapeHtml(ev.name)}</div>
          <div class="event-date">${ev.date || ''}${ev.venue ? ' · ' + escapeHtml(ev.venue) : ''}</div>
          ${showOwner ? `<div class="event-date">👤 ${escapeHtml(ev.ownerEmail || ev.ownerUid || '')}</div>` : ''}
        </div>
        <div class="event-actions">
          <a class="btn ghost small" style="text-decoration:none" href="event.html?id=${ev.id}">فتح</a>
          <button class="btn ghost small" style="border-color:rgba(255,120,120,0.4); color:#ff9d9d;" onclick="deleteEvent('${ev.id}', '${escapeHtml(ev.name).replace(/'/g, "\\'")}', '${ev.ownerUid}')">🗑</button>
        </div>
      </div>
      <div class="event-stats" id="stats-${ev.id}">
        <div class="event-stat"><div class="n">…</div><div class="l">كل الضيوف</div></div>
        <div class="event-stat"><div class="n">…</div><div class="l">حضروا</div></div>
      </div>
    </div>
  `).join('');
  events.forEach(loadEventStats);
}

async function loadEventStats(ev) {
  const { collection, getDocs } = window._fsFns;
  const box = document.getElementById('stats-' + ev.id);
  if (!box) return;
  try {
    const snap = await getDocs(collection(window._db, 'events', ev.id, 'guests'));
    const total = snap.size;
    const attended = snap.docs.filter(d => d.data().scanned).length;
    box.innerHTML = `
      <div class="event-stat"><div class="n">${total}</div><div class="l">كل الضيوف</div></div>
      <div class="event-stat"><div class="n">${attended}</div><div class="l">حضروا</div></div>
    `;
  } catch (e) {
    box.style.display = 'none';
  }
}

async function deleteEvent(eventId, name, ownerUid) {
  if (!confirm('حذف "' + name + '" نهائيًا؟\n\nراح ينحذف كل الضيوف والطلبات المرتبطة فيها، وما تقدر ترجعها بعدين.')) return;
  const { collection, getDocs, deleteDoc, doc, updateDoc, increment } = window._fsFns;
  try {
    const guestsSnap = await getDocs(collection(window._db, 'events', eventId, 'guests'));
    const requestsSnap = await getDocs(collection(window._db, 'events', eventId, 'requests'));
    await Promise.all([
      ...guestsSnap.docs.map(d => deleteDoc(d.ref)),
      ...requestsSnap.docs.map(d => deleteDoc(d.ref))
    ]);
    await deleteDoc(doc(window._db, 'events', eventId));

    // Free up the deleted event's slot. Best-effort: a failure here just
    // leaves the account's count one higher than reality, never lower, so
    // it can't be exploited to get more events than allowed.
    if (ownerUid) {
      try { await updateDoc(doc(window._db, 'accountLimits', ownerUid), { eventCount: increment(-1) }); }
      catch (e) { console.error(e); }
    }
  } catch (e) {
    alert('صار خطأ أثناء الحذف: ' + (e.code || '') + ' — ' + e.message);
    console.error(e);
  }
}

function escapeHtml(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

let eventsUnsub = null;
let limitUnsub = null;
let requestUnsub = null;
let adminRequestsUnsub = null;
let myEventsCount = 0;
let myEventLimit = 1;
let myPendingRequestId = null;

function initAuthWatcher() {
  const { onAuthStateChanged } = window._authFns;
  onAuthStateChanged(window._auth, (user) => {
    if (user) {
      document.getElementById('auth-view').style.display = 'none';
      document.getElementById('app-view').style.display = 'block';
      document.getElementById('current-email').textContent = user.email || '';
      const admin = isAdmin(user);
      document.getElementById('events-heading').textContent = admin ? 'كل المناسبات (أدمن)' : 'مناسباتي';
      watchEvents(user);
      if (admin) {
        watchAdminRequests();
      } else {
        watchMyLimitAndRequest(user);
      }
    } else {
      document.getElementById('auth-view').style.display = 'block';
      document.getElementById('app-view').style.display = 'none';
      if (eventsUnsub) { eventsUnsub(); eventsUnsub = null; }
      if (limitUnsub) { limitUnsub(); limitUnsub = null; }
      if (requestUnsub) { requestUnsub(); requestUnsub = null; }
      if (adminRequestsUnsub) { adminRequestsUnsub(); adminRequestsUnsub = null; }
      myEventLimit = 1;
      myPendingRequestId = null;
    }
  });
}

const AUTO_APPROVE_CEILING = 3; // customers can self-serve up to this many events; beyond it needs admin approval

function updateCreateGate(admin) {
  const btn = document.getElementById('create-toggle-btn');
  const box = document.getElementById('limit-box');
  const reqBtn = document.getElementById('request-more-btn');
  const pendingMsg = document.getElementById('pending-request-msg');
  const msg = document.getElementById('limit-box-msg');
  const locked = !admin && myEventsCount >= myEventLimit;
  btn.style.display = locked ? 'none' : 'block';
  box.style.display = locked ? 'block' : 'none';
  if (locked) {
    document.getElementById('create-form').style.display = 'none';
    if (myPendingRequestId) {
      reqBtn.style.display = 'none';
      pendingMsg.style.display = 'block';
    } else {
      reqBtn.style.display = 'block';
      pendingMsg.style.display = 'none';
      if (myEventLimit < AUTO_APPROVE_CEILING) {
        msg.textContent = 'وصلت لحد مناسباتك الحالي (' + myEventLimit + ').';
        reqBtn.textContent = '➕ فتح مناسبة إضافية';
        reqBtn.onclick = selfIncreaseLimit;
      } else {
        msg.textContent = 'وصلت للحد الأقصى المسموح ذاتيًا (' + AUTO_APPROVE_CEILING + '). لأي مناسبة زيادة لازم موافقة يدوية.';
        reqBtn.textContent = '🙋 اطلب مناسبة إضافية';
        reqBtn.onclick = requestExtraEvent;
      }
    }
  }
}

async function selfIncreaseLimit() {
  const { doc, runTransaction } = window._fsFns;
  const user = window._auth.currentUser;
  const limitRef = doc(window._db, 'accountLimits', user.uid);
  try {
    await runTransaction(window._db, async (tx) => {
      const snap = await tx.get(limitRef);
      const eventLimit = snap.exists() ? (snap.data().eventLimit || 1) : 1;
      if (eventLimit >= AUTO_APPROVE_CEILING) throw new Error('CEILING_REACHED');
      tx.update(limitRef, { eventLimit: eventLimit + 1 });
    });
  } catch (e) {
    if (e.message === 'CEILING_REACHED') { requestExtraEvent(); return; }
    alert('صار خطأ: ' + (e.code || '') + ' — ' + e.message);
    console.error(e);
  }
}

function watchEvents(user) {
  const { query, where, onSnapshot } = window._fsFns;
  if (eventsUnsub) eventsUnsub();
  const admin = isAdmin(user);
  const q = admin ? window._eventsCol : query(window._eventsCol, where('ownerUid', '==', user.uid));
  eventsUnsub = onSnapshot(q, (snap) => {
    const events = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    events.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
    myEventsCount = admin ? events.filter(ev => ev.ownerUid === user.uid).length : events.length;
    updateCreateGate(admin);
    renderEvents(events, admin);
  });
}

function watchMyLimitAndRequest(user) {
  const { doc, onSnapshot, collection, query, where } = window._fsFns;
  if (limitUnsub) limitUnsub();
  limitUnsub = onSnapshot(doc(window._db, 'accountLimits', user.uid), (snap) => {
    myEventLimit = snap.exists() ? (snap.data().eventLimit || 1) : 1;
    updateCreateGate(false);
  });
  if (requestUnsub) requestUnsub();
  requestUnsub = onSnapshot(
    query(collection(window._db, 'eventRequests'), where('uid', '==', user.uid), where('status', '==', 'pending')),
    (snap) => {
      myPendingRequestId = snap.empty ? null : snap.docs[0].id;
      updateCreateGate(false);
    }
  );
}

async function requestExtraEvent() {
  if (myPendingRequestId) return;
  const { collection, addDoc, serverTimestamp } = window._fsFns;
  const user = window._auth.currentUser;
  try {
    await addDoc(collection(window._db, 'eventRequests'), {
      uid: user.uid, email: user.email || '', status: 'pending', requestedAt: serverTimestamp()
    });
  } catch (e) {
    alert('صار خطأ: ' + (e.code || '') + ' — ' + e.message);
    console.error(e);
  }
}

function watchAdminRequests() {
  const { collection, query, where, onSnapshot } = window._fsFns;
  if (adminRequestsUnsub) adminRequestsUnsub();
  adminRequestsUnsub = onSnapshot(
    query(collection(window._db, 'eventRequests'), where('status', '==', 'pending')),
    (snap) => renderAdminRequests(snap.docs.map(d => ({ id: d.id, ...d.data() })))
  );
}

function renderAdminRequests(reqs) {
  const section = document.getElementById('admin-requests-section');
  const list = document.getElementById('admin-requests-list');
  if (reqs.length === 0) { section.style.display = 'none'; list.innerHTML = ''; return; }
  section.style.display = 'block';
  document.getElementById('admin-requests-badge').textContent = reqs.length > 99 ? '99+' : String(reqs.length);
  list.innerHTML = reqs.map(r => `
    <div class="card event-card-top">
      <div>
        <div class="event-name">${escapeHtml(r.email || r.uid)}</div>
        <div class="event-date">طلب مناسبة إضافية</div>
      </div>
      <div class="event-actions">
        <button class="btn small" style="margin:0; width:auto; padding:8px 14px;" onclick="approveEventRequest('${r.id}','${r.uid}')">✅ قبول</button>
        <button class="btn ghost small" style="margin:0; width:auto; padding:8px 14px;" onclick="rejectEventRequest('${r.id}')">❌ رفض</button>
      </div>
    </div>
  `).join('');
}

async function approveEventRequest(requestId, uid) {
  const { doc, getDoc, setDoc, updateDoc, increment } = window._fsFns;
  try {
    const limitRef = doc(window._db, 'accountLimits', uid);
    const limitSnap = await getDoc(limitRef);
    if (limitSnap.exists()) {
      await updateDoc(limitRef, { eventLimit: increment(1) });
    } else {
      await setDoc(limitRef, { eventLimit: 2, eventCount: 0 });
    }
    await updateDoc(doc(window._db, 'eventRequests', requestId), { status: 'approved' });
  } catch (e) {
    alert('صار خطأ: ' + (e.code || '') + ' — ' + e.message);
    console.error(e);
  }
}

async function rejectEventRequest(requestId) {
  const { doc, updateDoc } = window._fsFns;
  try {
    await updateDoc(doc(window._db, 'eventRequests', requestId), { status: 'rejected' });
  } catch (e) {
    alert('صار خطأ: ' + (e.code || '') + ' — ' + e.message);
    console.error(e);
  }
}

if (window._auth) initAuthWatcher();
else window.addEventListener('appDbReady', initAuthWatcher);
</script>
