<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة المنظّم | دعوات</title>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import {
    getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword,
    onAuthStateChanged, signOut
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import {
    getFirestore, collection, addDoc, query, where, onSnapshot, serverTimestamp, doc, setDoc, getDocs, deleteDoc
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDbjJtLLDniHbALfUhzQ-UiN2j5txR8PGM",
    authDomain: "wedding-qr-16d01.firebaseapp.com",
    projectId: "wedding-qr-16d01",
    storageBucket: "wedding-qr-16d01.firebasestorage.app",
    messagingSenderId: "1036657421971",
    appId: "1:1036657421971:web:7ac5618871ec061fba6766"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const eventsCol = collection(db, 'events');

  window._auth = auth;
  window._db = db;
  window._eventsCol = eventsCol;
  window._authFns = { createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut };
  window._fsFns = { collection, addDoc, query, where, onSnapshot, serverTimestamp, doc, setDoc, getDocs, deleteDoc };
  window._readyEvent = new Event('appDbReady');
  window.dispatchEvent(window._readyEvent);
</script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Tajawal:wght@400;500;700&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Tajawal',sans-serif; background:#0A0A0A; color:#FAF8F4; min-height:100vh; }
  .wrap { max-width:480px; margin:0 auto; padding:32px 18px 60px; }
  h1 { font-family:'Playfair Display',serif; color:#E0BC7A; font-size:26px; text-align:center; margin-bottom:6px; }
  .sub { text-align:center; color:#B8B4AC; font-size:13px; margin-bottom:28px; }
  .card { background:rgba(255,255,255,0.04); border:1px solid rgba(224,188,122,0.2); border-radius:16px; padding:22px; margin-bottom:16px; }
  input { width:100%; padding:13px 14px; margin-bottom:12px; border-radius:10px; background:rgba(255,255,255,0.04); border:1px solid rgba(224,188,122,0.25); color:#FAF8F4; font-size:15px; font-family:inherit; }
  input:focus { outline:none; border-color:#E0BC7A; }
  .btn { width:100%; padding:13px; border:none; border-radius:10px; background:linear-gradient(135deg,#C99B4A,#E0BC7A); color:#1a1400; font-weight:700; font-size:15px; cursor:pointer; margin-bottom:10px; }
  .btn.ghost { background:transparent; border:1px solid rgba(224,188,122,0.3); color:#E0BC7A; }
  .btn.small { width:auto; padding:8px 16px; font-size:13px; }
  .toggle-row { text-align:center; font-size:13px; color:#B8B4AC; margin-top:4px; }
  .toggle-row a { color:#E0BC7A; cursor:pointer; text-decoration:underline; }
  .err { color:#ff9d9d; font-size:13px; margin-bottom:10px; text-align:center; }
  .event-card { display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .event-name { font-weight:700; color:#E0BC7A; font-size:15px; }
  .event-date { color:#B8B4AC; font-size:12px; margin-top:3px; }
  .topbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
  #hidden-forms > div { display:none; }
  .empty { text-align:center; color:#6f6a62; font-size:14px; padding:20px 0; }
</style>
</head>
<body>
<div class="wrap">

  <div id="auth-view">
    <h1><a href="landing.html" style="color:inherit; text-decoration:none;">دعوات</a></h1>
    <div class="sub">لوحة تحكم المنظّمين — أنشئ دعوة رقمية لمناسبتك</div>
    <div class="card">
      <div id="auth-err" class="err" style="display:none"></div>
      <input type="email" id="auth-email" placeholder="البريد الإلكتروني">
      <input type="password" id="auth-pass" placeholder="كلمة المرور">
      <button class="btn" id="auth-submit-btn" onclick="submitAuth()">دخول</button>
      <div class="toggle-row" id="auth-toggle">ما عندك حساب؟ <a onclick="toggleAuthMode()">سجّل واحد جديد</a></div>
    </div>
  </div>

  <div id="app-view" style="display:none">
    <div class="topbar">
      <h1 style="margin:0; font-size:20px;" id="events-heading">مناسباتي</h1>
      <button class="btn ghost small" onclick="doLogout()">🔓 خروج</button>
    </div>
    <div class="sub" style="margin-bottom:20px;">
      مسجّل دخول بحساب: <span id="current-email" style="color:#E0BC7A"></span>
      — مو حسابك؟ <a onclick="doLogout()" style="color:#E0BC7A; cursor:pointer; text-decoration:underline;">سجّل بحساب ثاني</a>
    </div>

    <button class="btn" id="create-toggle-btn" onclick="showCreateForm()">➕ إنشاء مناسبة جديدة</button>
    <div class="sub" id="limit-msg" style="display:none; margin-bottom:16px;">عندك مناسبة واحدة مفعّلة على حسابك حاليًا. تحتاج مناسبة ثانية؟ تواصل معنا.</div>

    <div class="card" id="create-form" style="display:none">
      <input type="text" id="ev-name" placeholder="اسم المناسبة (مثال: عرس حسن وفاطمة)">
      <input type="date" id="ev-date" placeholder="التاريخ">
      <input type="text" id="ev-venue" placeholder="مكان الحفل">
      <button class="btn" onclick="createNewEvent()">إنشاء</button>
    </div>

    <div id="events-list"></div>
  </div>

</div>

<script>
const ADMIN_EMAILS = ['hsallah@outlook.sa'];
function isAdmin(user) { return !!user && ADMIN_EMAILS.includes((user.email || '').toLowerCase()); }

let authMode = 'login'; // or 'signup'

function toggleAuthMode() {
  authMode = authMode === 'login' ? 'signup' : 'login';
  document.getElementById('auth-submit-btn').textContent = authMode === 'login' ? 'دخول' : 'إنشاء حساب';
  document.getElementById('auth-toggle').innerHTML = authMode === 'login'
    ? 'ما عندك حساب؟ <a onclick="toggleAuthMode()">سجّل واحد جديد</a>'
    : 'عندك حساب؟ <a onclick="toggleAuthMode()">سجّل دخول</a>';
}

function showAuthError(msg) {
  const el = document.getElementById('auth-err');
  el.textContent = msg;
  el.style.display = 'block';
}

async function submitAuth() {
  const email = document.getElementById('auth-email').value.trim();
  const pass = document.getElementById('auth-pass').value;
  document.getElementById('auth-err').style.display = 'none';
  if (!email || !pass) { showAuthError('عبّي البريد وكلمة المرور'); return; }

  const { createUserWithEmailAndPassword, signInWithEmailAndPassword } = window._authFns;
  try {
    if (authMode === 'signup') {
      await createUserWithEmailAndPassword(window._auth, email, pass);
    } else {
      await signInWithEmailAndPassword(window._auth, email, pass);
    }
  } catch (e) {
    const map = {
      'auth/email-already-in-use': 'البريد مسجّل مسبقًا — جرب تسجّل دخول',
      'auth/invalid-credential': 'البريد أو كلمة المرور غلط',
      'auth/weak-password': 'كلمة المرور لازم تكون ٦ أحرف على الأقل',
      'auth/invalid-email': 'صيغة البريد غير صحيحة'
    };
    showAuthError(map[e.code] || ('خطأ: ' + e.message));
  }
}

function doLogout() {
  const { signOut } = window._authFns;
  signOut(window._auth);
}

function showCreateForm() {
  const f = document.getElementById('create-form');
  f.style.display = f.style.display === 'block' ? 'none' : 'block';
}

function newEventId() {
  return Math.random().toString(36).substr(2, 6) + Date.now().toString(36).substr(-4);
}

async function createNewEvent() {
  const name = document.getElementById('ev-name').value.trim();
  const date = document.getElementById('ev-date').value;
  const venue = document.getElementById('ev-venue').value.trim();
  if (!name) { alert('اكتب اسم المناسبة'); return; }

  if (!isAdmin(window._auth.currentUser) && myEventsCount >= 1) {
    alert('عندك مناسبة واحدة مفعّلة على حسابك حاليًا. تواصل معنا لو تحتاج مناسبة ثانية.');
    return;
  }

  const { serverTimestamp, doc, setDoc } = window._fsFns;
  const eventId = newEventId();
  const scanPin = String(Math.floor(1000 + Math.random() * 9000)); // 4-digit PIN for the door/security team
  try {
    await setDoc(doc(window._db, 'events', eventId), {
      name, date, venue, scanPin,
      ownerUid: window._auth.currentUser.uid,
      ownerEmail: window._auth.currentUser.email || '',
      createdAt: serverTimestamp()
    });
    window.location.href = 'event.html?id=' + eventId;
  } catch (e) {
    alert('صار خطأ: ' + e.code + ' — ' + e.message);
    console.error(e);
  }
}

function renderEvents(events, showOwner) {
  const list = document.getElementById('events-list');
  if (events.length === 0) {
    list.innerHTML = '<div class="empty">لسه ما أنشأت أي مناسبة</div>';
    return;
  }
  list.innerHTML = events.map(ev => `
    <div class="card event-card">
      <div>
        <div class="event-name">${escapeHtml(ev.name)}</div>
        <div class="event-date">${ev.date || ''}${ev.venue ? ' · ' + escapeHtml(ev.venue) : ''}</div>
        ${showOwner ? `<div class="event-date">👤 ${escapeHtml(ev.ownerEmail || ev.ownerUid || '')}</div>` : ''}
      </div>
      <div style="display:flex; gap:6px;">
        <a class="btn ghost small" style="text-decoration:none" href="event.html?id=${ev.id}">فتح</a>
        <button class="btn ghost small" style="border-color:rgba(255,120,120,0.4); color:#ff9d9d;" onclick="deleteEvent('${ev.id}', '${escapeHtml(ev.name).replace(/'/g, "\\'")}')">🗑</button>
      </div>
    </div>
  `).join('');
}

async function deleteEvent(eventId, name) {
  if (!confirm('حذف "' + name + '" نهائيًا؟\n\nراح ينحذف كل الضيوف والطلبات المرتبطة فيها، وما تقدر ترجعها بعدين.')) return;
  const { collection, getDocs, deleteDoc, doc } = window._fsFns;
  try {
    const guestsSnap = await getDocs(collection(window._db, 'events', eventId, 'guests'));
    const requestsSnap = await getDocs(collection(window._db, 'events', eventId, 'requests'));
    await Promise.all([
      ...guestsSnap.docs.map(d => deleteDoc(d.ref)),
      ...requestsSnap.docs.map(d => deleteDoc(d.ref))
    ]);
    await deleteDoc(doc(window._db, 'events', eventId));
  } catch (e) {
    alert('صار خطأ أثناء الحذف: ' + (e.code || '') + ' — ' + e.message);
    console.error(e);
  }
}

function escapeHtml(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

let eventsUnsub = null;
let myEventsCount = 0;

function initAuthWatcher() {
  const { onAuthStateChanged } = window._authFns;
  onAuthStateChanged(window._auth, (user) => {
    if (user) {
      document.getElementById('auth-view').style.display = 'none';
      document.getElementById('app-view').style.display = 'block';
      document.getElementById('current-email').textContent = user.email || '';
      document.getElementById('events-heading').textContent = isAdmin(user) ? 'كل المناسبات (أدمن)' : 'مناسباتي';
      watchEvents(user);
    } else {
      document.getElementById('auth-view').style.display = 'block';
      document.getElementById('app-view').style.display = 'none';
      if (eventsUnsub) { eventsUnsub(); eventsUnsub = null; }
    }
  });
}

function updateCreateGate(admin) {
  const btn = document.getElementById('create-toggle-btn');
  const msg = document.getElementById('limit-msg');
  const locked = !admin && myEventsCount >= 1;
  btn.style.display = locked ? 'none' : 'block';
  msg.style.display = locked ? 'block' : 'none';
  if (locked) document.getElementById('create-form').style.display = 'none';
}

function watchEvents(user) {
  const { query, where, onSnapshot } = window._fsFns;
  if (eventsUnsub) eventsUnsub();
  const admin = isAdmin(user);
  const q = admin ? window._eventsCol : query(window._eventsCol, where('ownerUid', '==', user.uid));
  eventsUnsub = onSnapshot(q, (snap) => {
    const events = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    events.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
    myEventsCount = admin ? events.filter(ev => ev.ownerUid === user.uid).length : events.length;
    updateCreateGate(admin);
    renderEvents(events, admin);
  });
}

if (window._auth) initAuthWatcher();
else window.addEventListener('appDbReady', initAuthWatcher);
</script>
</body>
</html>
